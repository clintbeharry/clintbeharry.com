<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Into the network</title>
<meta name="description" content="Ask a question and watch a language model answer it, running in your own browser.">
<link rel="icon" href="../favicon.svg">
<style>
/* ---------------------------------------------------------------------------
   A chat thread, and nothing else. The machinery shows up where a chat
   interface already puts the model's thinking, so it needs no introducing.
--------------------------------------------------------------------------- */
:root{
  --page:#191919; --raised:#303030;
  --ink:#ffffffed; --dim:#ffffff91; --dimmer:#ffffff66;
  --rule:#ffffff0a; --rule-2:#ffffff14;
  --clay:#d97757; --clay-hot:#c6613f;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --col:760px;
  color-scheme:dark;
}
*{box-sizing:border-box}
/* 100% of what, on a phone, changes as the browser chrome slides away, which
   is how the page ended up taller than the window and scrolling as a whole.
   dvh is the window as it actually is at that moment. */
html,body{height:100%;margin:0;background:var(--page);overflow:hidden}
body{height:100dvh}
body{color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}

/* A field opening to the right of the last word on a line reaches past the
   column, and absolutely positioned things still count toward the page width.
   Clipped here, so a fan near the edge is cut rather than scrolling the site. */
#thread{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:32px 20px 8px}
#thread::-webkit-scrollbar{width:10px}
#thread::-webkit-scrollbar-thumb{background:#ffffff1f;border-radius:5px}
.inner{max-width:var(--col);margin:0 auto}

/* the asker on the right in a bubble, the model on the left at full width */
.turn{margin:0 0 26px}
.turn.user{display:flex;justify-content:flex-end}
.said{background:var(--raised);border-radius:16px;padding:9px 15px;max-width:76%;
  line-height:1.5;white-space:pre-wrap;word-break:break-word}
.q{background:var(--raised);border-radius:16px;padding:9px 15px;max-width:76%;
  line-height:1.5;opacity:0;transition:opacity .45s ease}
.q b{font-weight:400}

.turn.bot .who{display:flex;align-items:flex-start;gap:10px;margin:0 0 13px;
  font-family:var(--mono);font-size:11.5px;min-height:14px}

/* The thinking mark. Three dots is what every chat uses to say it is working,
   and it belongs to none of them. Deliberately not anyone's logo. */
.think{display:inline-flex;gap:4px;align-items:center;flex:0 0 auto;margin-top:4px;
  transition:opacity .55s ease}
.think b{width:5px;height:5px;border-radius:50%;background:var(--clay);
  animation:thinkpulse 1.35s ease-in-out infinite}
.think b:nth-child(2){animation-delay:.17s}
.think b:nth-child(3){animation-delay:.34s}
@keyframes thinkpulse{0%,72%,100%{opacity:.26;transform:scale(.78)}
                      34%{opacity:1;transform:scale(1)}}
/* once there is a cursor, the page is answering rather than working out what
   to answer, so the mark hands over to it */
.turn.bot.answering .think{opacity:0}

/* What the machine is doing, with a pulse travelling along it so the line
   itself reads as work in progress. */
/* it wraps rather than truncating: on a phone the line was being cut off
   mid-sentence, which is a poor way to explain anything */
#hud{letter-spacing:.02em;line-height:1.35;
  background:linear-gradient(90deg,
    var(--dimmer) 0%, var(--dimmer) 38%, #ffffff 50%, var(--dimmer) 62%, var(--dimmer) 100%);
  background-size:260% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:sweep 2.8s linear infinite;transition:opacity .5s ease}
@keyframes sweep{0%{background-position:130% 0}100%{background-position:-30% 0}}
.turn.bot.spoken #hud{opacity:0}
@media (prefers-reduced-motion:reduce){
  #hud{animation:none;background:none;color:var(--dimmer)}
}
.turn.bot .answer{margin:14px 0 0;white-space:pre-wrap;word-break:break-word}

/* The visualisation sits where a chat puts its thinking, and sits ON the
   thread rather than inside a frame. A border and a darker fill made it read
   as a video embedded in the page, which is the opposite of the claim: this
   is the message being formed, not a recording of one. */
/* The stage takes its shape from the room it is in. A fixed wide slab leaves
   a phone showing a short strip with the whole sequence shrunk inside it,
   when what a phone actually has is height. */
.stage{position:relative;overflow:hidden;background:var(--page);
  width:100%;aspect-ratio:1000/540;
  transition:height .6s cubic-bezier(.4,0,.2,1),opacity .45s ease}
.stage canvas{display:block;width:100%;height:100%;position:absolute;inset:0}

#ov{pointer-events:none}
/* The caption used to be pinned inside the stage. It lives in the message's
   own line now, beside the thinking mark, so it is laid out rather than
   placed: absolute positioning left it stuck to the corner of the window. */
.hud{font-family:var(--mono);font-size:11.5px;pointer-events:none;
  letter-spacing:.02em;min-width:0}
/* parked offscreen until a turn claims it, at a real size so the canvas
   does not have to be resized from zero when it lands */
#park{position:fixed;left:-10000px;top:0;width:1000px;height:560px}

/* ---- the reply, written into the thread ----
   Each word reserves room under itself for the field it was chosen from. The
   band is deliberately shallower than the field is tall when it opens: the
   field opens out to the RIGHT of the word, where there is room, and only
   settles underneath once the word has been taken. The drop from open field
   to finished sentence is a small one that way. */
.reply{--row:11px;          /* spacing once the field has settled */
  --gap:4px;              /* and how far under the word it settles */
  /* The band has to clear the field while it is OPEN, which hangs further
     down than the settled rows do. Tying it to the settled spacing meant the
     two could not be tuned apart: pulling the alternatives up under their
     word also pulled the next line up into the open field. */
  --band:88px;
  line-height:var(--band);margin:calc((1.6em - var(--band))/2) 0 0;
  white-space:pre-wrap;word-break:break-word;color:var(--ink)}
/* finished, the words give back the room they were holding */
.reply.done .tok{--mag:0;--spread:0}
.reply.done{--band:1.65em;
  transition:line-height .55s cubic-bezier(.3,0,.2,1),margin-top .55s cubic-bezier(.3,0,.2,1)}
/* exploring reopens the band, so the fields have somewhere to be again */
.reply.done.inspect{--band:88px}

.tok{position:relative;display:inline-block;white-space:pre;vertical-align:baseline;
  line-height:1.3;text-align:center;
  /* Two falloffs, not one. --spread is the room a word takes, --mag is how
     strongly its field shows. Tied together, a neighbour at half strength
     showed a full-width field in half the room and sat on top of its
     neighbour's. Room has to open faster than the field appears. */
  padding-left:calc(var(--pad,0ch) * var(--spread,1));
  padding-right:calc(var(--pad,0ch) * var(--spread,1));
  transition:padding .26s cubic-bezier(.3,0,.2,1)}
.tok .word{display:inline-block;line-height:1.3;opacity:0;
  transition:opacity .16s ease,color .3s ease}
.tok.set .word{opacity:1;color:var(--ink)}

/* The lines back to the word. Without them the field reads as a list that
   happens to be sitting there rather than things one word led to. */
.wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;
  opacity:0;transition:opacity .26s ease}
.wires.in{opacity:1}

/* The field. Anchored at the word's baseline; every row places itself, so it
   can open to the right and settle underneath without relayout. */
.fan{position:absolute;left:50%;top:100%;width:0;height:0;pointer-events:none}
.fan i{position:absolute;left:0;top:0;font-style:normal;
  display:flex;gap:5px;align-items:baseline;white-space:pre;
  height:var(--row);line-height:var(--row);font-size:12.5px;color:var(--dim);
  /* --cx is the anchor: open, a row hangs to the RIGHT of the word from its
     centre; settled, it centres under it. Centre-anchored throughout, a row
     wider than its word reached back over the word it came from. */
  transform:translate(calc(var(--cx,-50%) + var(--x,0px)), var(--y,0px));
  opacity:0;
  transition:transform .42s cubic-bezier(.3,0,.2,1),opacity .26s ease}
.fan i s{font-family:var(--mono);font-size:9.5px;color:var(--dimmer);
  text-decoration:none;font-variant-numeric:tabular-nums}
.fan.in i{opacity:var(--o,.35)}
.fan i.win{color:var(--clay);font-weight:500}
.fan i.win s{color:var(--clay);opacity:.75}
.fan.out i:not(.win){opacity:0}
.fan.rest i{opacity:0}
/* What a word nearly was is the point of the piece, so the traces it leaves
   are worth reading rather than merely sensing. */
.fan.rest i.keep{opacity:calc(var(--o,.35) * .72);transition:opacity .7s ease}

/* Faded out is not gone: an invisible field is still part of the text, so
   selecting the finished answer copied every rejected word with it. */
.reply.done .fan{opacity:0;visibility:hidden;
  transition:opacity .4s ease,visibility 0s linear .4s}
.reply.done.inspect .fan{opacity:var(--mag,0);visibility:visible;
  transition:opacity .26s ease}
.reply.done.inspect .fan i{opacity:var(--o,.35)}
.reply.done.inspect .fan i.win{opacity:1}

/* the share it was taken at, rising away above the line */
.lift{position:absolute;left:50%;top:-2px;transform:translateX(-50%);
  font-family:var(--mono);font-size:10px;color:var(--clay);pointer-events:none;
  opacity:0;white-space:pre}
.lift.go{opacity:1;animation:liftaway 2.4s cubic-bezier(.25,.6,.3,1) forwards}
@keyframes liftaway{
  0%{opacity:0;transform:translate(-50%,4px)}
  14%{opacity:.95;transform:translate(-50%,-6px)}
  100%{opacity:0;transform:translate(-50%,-34px)}
}
.caret{display:inline-block;width:2px;height:1.05em;vertical-align:-.16em;
  background:var(--clay);border-radius:1px;animation:blink 1.15s steps(1,end) infinite}
@keyframes blink{0%,45%{opacity:1}46%,100%{opacity:0}}

/* message actions, the way a chat shows copy and retry */
.acts{display:flex;gap:4px;margin:9px 0 0}
.acts button{appearance:none;background:none;border:0;cursor:pointer;
  color:var(--dimmer);font:inherit;font-size:12px;padding:4px 8px;border-radius:7px}
.acts button:hover:not(:disabled){color:var(--ink);background:#ffffff0f}
.acts button:disabled{opacity:.35;cursor:default}

/* the one thing the page does ask, before spending someone's bandwidth */
.gate{border:1px solid var(--rule-2);border-radius:12px;padding:14px 16px;
  background:#1f1f1f;max-width:62ch}
.gate p{margin:0 0 12px;color:var(--dim);font-size:14px}
.gate b{color:var(--ink);font-weight:600}
.gate .row{display:flex;gap:8px;flex-wrap:wrap}
.gate button{appearance:none;font:inherit;font-size:13px;padding:7px 14px;
  border-radius:9px;cursor:pointer;border:1px solid var(--rule-2);
  background:#272727;color:var(--dim)}
.gate button:hover{color:var(--ink);border-color:#ffffff2e}
.gate button.go{background:var(--clay);border-color:var(--clay);color:#1a1008;font-weight:600}
.gate button.go:hover{background:var(--clay-hot)}

footer{flex:0 0 auto;padding:6px 20px 20px;background:var(--page)}
.bar{max-width:var(--col);margin:0 auto}
/* Out of the way until asked for. They are a prompt, not furniture, and on a
   phone they were taking up most of the screen before anything had happened. */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:0;padding:0;list-style:none;
  max-height:0;opacity:0;overflow:hidden;
  transition:max-height .32s cubic-bezier(.3,0,.2,1),opacity .24s ease,
             margin .32s cubic-bezier(.3,0,.2,1)}
.bar.open .chips{max-height:40vh;opacity:1;margin:0 0 11px}
.chip{font:inherit;font-size:12.5px;color:var(--dim);background:transparent;
  border:1px solid var(--rule-2);border-radius:999px;padding:6px 13px;cursor:pointer;
  transition:background .15s ease,color .15s ease}
.chip:hover{color:var(--ink);background:#ffffff0f}
.composer{background:var(--raised);border-radius:16px;padding:8px;
  border:1px solid var(--rule-2)}
.line{display:flex;align-items:flex-end;gap:8px;padding-left:8px}
#msg{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:inherit;
  font-size:15px;line-height:21px;padding:7px 0}
#msg:focus{outline:none}
#msg::placeholder{color:var(--dimmer)}
#send{flex:0 0 auto;width:28px;height:28px;border-radius:8px;border:0;cursor:pointer;
  background:var(--clay);color:#fff;display:grid;place-items:center;
  transition:background .15s ease}
#send:hover:not(:disabled){background:var(--clay-hot)}
#send:disabled{background:#ffffff1a;color:var(--dimmer);cursor:default}
#send svg{width:15px;height:15px;display:block}
button:focus-visible,input:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
@media (max-width:700px){
  #thread{padding:20px 14px 6px} footer{padding:6px 14px 16px}
  .said,.q{max-width:88%}
  /* upright, because that is the shape of the space a phone has */
  .stage{aspect-ratio:3/4}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<main id="thread"><div class="inner" id="log"></div></main>

<footer><div class="bar">
  <ul class="chips" id="chips"></ul>
  <div class="composer">
    <div class="line">
      <input id="msg" type="text" autocomplete="off" spellcheck="false"
             placeholder="Ask anything">
      <button id="send" title="Ask" disabled aria-label="Ask">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 13V3.5M8 3.5 3.5 8M8 3.5 12.5 8" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
</div></footer>

<!-- claimed by whichever turn is current -->
<div id="park">
  <div class="q" id="q"></div>
  <div class="stage" id="stage">
    <canvas id="gl"></canvas>
    <canvas id="ov"></canvas>
    <div class="hud" id="hud"></div>
  </div>
  <span id="step"></span><span id="note"></span><button id="pause"></button>
</div>

let G=null, NQ=0;
const $=id=>document.getElementById(id);
const FONT='ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif';
const MONO='ui-monospace,"SF Mono",Menlo,Consolas,monospace';
const CLAY=0xd97757, GREY=0x6e6e6e, WIRE=0xa96c55;
const CLAYC="#d97757", INKC="#d4d4d4";

/* ------------------------------------------------------------------ stage */
const gl=$("gl"), ov=$("ov"), stageEl=$("stage"), ctx=ov.getContext("2d");
const renderer=new THREE.WebGLRenderer({canvas:gl,antialias:true,alpha:false});
renderer.setClearColor(0x191919,1);   /* the thread background, not a frame */
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(38,16/9,1,6000);
let DPR=Math.min(2,window.devicePixelRatio||1), VW=1000, VH=540;
/* The sequence is laid out in world units that come out about one-to-one with
   pixels on a 1000px stage, which is what it was built against. Positions
   scale with the stage automatically, because they project to normalised
   coordinates and get multiplied by the width. Anything measured in pixels
   does not, so on a narrower stage the type stayed put while the layout
   closed up around it and the words collided. PXS carries that scale to
   everything drawn in pixel space. */
let PXS=1;
function resize(){
  VW=stageEl.clientWidth||1000; VH=stageEl.clientHeight||Math.round(VW*.54);
  /* Type cannot scale all the way down with the stage or a phone gets four
     pixel words. Below about 600px it holds a floor and the layout, which
     does scale, simply carries fewer things per inch. */
  PXS=cl(VW/1000,.95,1.25);
  renderer.setPixelRatio(DPR); renderer.setSize(VW,VH,false);
  ov.width=Math.round(VW*DPR); ov.height=Math.round(VH*DPR);
  ov.style.width=VW+"px"; ov.style.height=VH+"px";
  cam.aspect=VW/VH; cam.updateProjectionMatrix();
}
addEventListener("resize",resize);

const MAXE=3600;
const egeo=new THREE.BufferGeometry();
egeo.setAttribute("position",new THREE.BufferAttribute(new Float32Array(MAXE*6),3));
egeo.setAttribute("color",new THREE.BufferAttribute(new Float32Array(MAXE*8),4));
const lineMat=new THREE.LineBasicMaterial({vertexColors:true,transparent:true,
  blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false});
const lines=new THREE.LineSegments(egeo,lineMat);
lines.frustumCulled=false; scene.add(lines);

/* ------------------------------------------------------------------ model */
let NODES=[], EDGES=[], HITS=[], LATE=null;
let CAMR=565, CAMY=0, CAMA=0, CAMB=0, LOOK=new THREE.Vector3(0,0,0);
let BOXR=[400,150,190];
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const cl=(v,a,b)=>Math.max(a===undefined?0:a,Math.min(b===undefined?1:b,v));
const io=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const out=k=>1-Math.pow(1-k,3);
const seg=(t,a,b)=>cl((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const rotY=(v,a)=>V3(v.x*Math.cos(a)-v.z*Math.sin(a),v.y,v.x*Math.sin(a)+v.z*Math.cos(a));

function mkNode(w,x,y,z,o){
  const n={w,p:V3(x,y,z),h:V3(x,y,z),op:(o===undefined?1:o),clay:false,size:1,dr:0,
    am:7+Math.random()*9,sp:.00030+Math.random()*.00045,
    ph:[Math.random()*6.283,Math.random()*6.283,Math.random()*6.283]};
  NODES.push(n); return n;
}
function mkEdge(a,b,col,o,w){
  const e={a,b,col:new THREE.Color(col===undefined?GREY:col),
           op:(o===undefined?1:o),w:(w===undefined?.5:w)};
  EDGES.push(e); return e;
}
function hash3(w){
  let h=2166136261>>>0;
  for(let i=0;i<w.length;i++){h^=w.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}
  return [((h)&1023)/1023-.5,((h>>>10)&1023)/1023-.5,((h>>>20)&1023)/1023-.5];
}
const rel1=xy=>Math.max(.1,1-Math.hypot(xy[0],xy[1]));
function faceHit(p,R){
  const d=p.clone();
  if(d.length()<1e-3) d.set(1,0,0);
  d.normalize();
  let t=1e9;
  for(let i=0;i<3;i++){ const v=[d.x,d.y,d.z][i];
    if(Math.abs(v)>1e-6) t=Math.min(t,R[i]/Math.abs(v)); }
  return d.multiplyScalar(t);
}

function sync(){
  const P=egeo.attributes.position.array, C=egeo.attributes.color.array;
  const n=Math.min(EDGES.length,MAXE);
  for(let i=0;i<n;i++){
    /* GL lines are one pixel wide whatever you ask for, so an edge's weight
       has to arrive as brightness. The range was narrow enough that a strong
       link and a weak one looked alike; it is wide now, and starts higher, so
       the mesh holds up on a small screen. */
    const e=EDGES[i], A=e.a.p, B=e.b.p, k=i*6, c=i*8, g=e.op*(.15+e.w*.44);
    P[k]=A.x;P[k+1]=A.y;P[k+2]=A.z;P[k+3]=B.x;P[k+4]=B.y;P[k+5]=B.z;
    /* strength in the alpha channel, colour left at full value: folding it
       into rgb draws an opaque dark line the moment blending is not additive */
    C[c]=C[c+4]=e.col.r; C[c+1]=C[c+5]=e.col.g; C[c+2]=C[c+6]=e.col.b;
    C[c+3]=C[c+7]=g;
  }
  egeo.setDrawRange(0,n*2);
  egeo.attributes.position.needsUpdate=true;
  egeo.attributes.color.needsUpdate=true;
}

const HX=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
const CLAYV=HX(CLAYC), INKV=HX(INKC), MONOV=HX("#9b9b9b");
/* Each set of axes gets its own accent, so a change of colour says the words
   are being associated a different way. Picked at a similar lightness to the
   clay so nothing jumps in weight when the hue turns, and the last set comes
   home to clay so the fold into the cursor opens in the house colour. */
const VIEWC=[[CLAY,CLAYC],[0x5f9fd9,"#5f9fd9"],
             [0x6cbf8f,"#6cbf8f"],[CLAY,CLAYC]];
let ACC=CLAY, ACCV=CLAYV.slice(), ACCC=CLAYC;
const mixv=(a,b,k)=>a.map((v,i)=>Math.round(v+(b[i]-v)*k));
function setAcc(hex,css){ ACC=hex; ACCC=css; ACCV=HX(css); }
function blendAcc(c1,c2,k){
  ACCV=mixv(HX(c1[1]),HX(c2[1]),k);
  ACCC="rgb("+ACCV.join(",")+")";
  ACC=(ACCV[0]<<16)|(ACCV[1]<<8)|ACCV[2];
}
const mixc=(a,b,k)=>"rgb("+a.map((v,i)=>Math.round(v+(b[i]-v)*k)).join(",")+")";
const REF=760;
function labels(){
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,VW,VH);
  const list=[];
  for(const n of NODES){
    if(n.op<=.02||!n.w) continue;
    const v=n.p.clone().project(cam);
    if(v.z<-1||v.z>1) continue;
    const d=cam.position.distanceTo(n.p);
    /* the far end of the range bottomed out at .3, which on a phone stage is
       four pixels of type. Depth still reads, it just reads over a narrower
       range than it used to. */
    list.push({n,x:(v.x*.5+.5)*VW,y:(-v.y*.5+.5)*VH,s:cl(REF/d,.60,2.1),z:v.z});
  }
  list.sort((a,b)=>b.z-a.z);
  ctx.textAlign="center";
  for(const it of list){
    const fs=it.n.size*12.5*it.s*PXS;
    if(fs<4.2*PXS) continue;
    /* words on the reply line share a baseline, the way type in a chat thread
       does, so a size still easing cannot ride them up or down */
    ctx.textBaseline=it.n.baseline?"alphabetic":"middle";
    /* Weight belongs to what a word IS, not to whether it happens to be lit.
       Tying bold to the clay flag meant words changed weight the moment the
       wiring front touched them, and left the cloud in mixed weights at every
       hand-off. The question's own words are bold throughout and nothing else
       ever changes weight. */
    ctx.font=(it.n.bold?"600 ":"")+fs.toFixed(1)+"px "+(it.n.mono?MONO:FONT);
    ctx.globalAlpha=cl(it.n.op*cl((it.s-.34)/.34,.14,1));
    ctx.fillStyle = it.n.warm!==undefined
      ? mixc(it.n.mono?MONOV:INKV,it.n.fixed?CLAYV:ACCV,cl(it.n.warm))
      : (it.n.clay?ACCC:(it.n.mono?"#9b9b9b":INKC));
    ctx.fillText(it.n.w,it.x,it.y);
  }
  ctx.globalAlpha=1;
  drawHits();
  if(LATE) LATE();
}
function drawHits(){
  for(const h of HITS){
    const e=h.e, o=e?e.op:1;
    if(o<=.04) continue;
    const p=h.n.p;
    let best=0;
    for(let i=0;i<3;i++) best=Math.max(best,Math.abs([p.x,p.y,p.z][i])/(BOXR[i]||1));
    if(best<.62) continue;
    const v=p.clone().project(cam);
    if(v.z<-1||v.z>1) continue;
    ctx.globalAlpha=cl(o*.8*cl((best-.62)/.3));
    ctx.fillStyle=(e?e.col:new THREE.Color(CLAY)).getStyle();
    ctx.beginPath();
    ctx.arc((v.x*.5+.5)*VW,(-v.y*.5+.5)*VH,.7*PXS,0,6.2832);
    ctx.fill();
  }
  ctx.globalAlpha=1;
}
/* The caret is a 21-unit bar standing in the world, so the collapsing stack
   can land on exactly its size and place rather than near them. */
const CH=21;
function caret(world,alpha,T){
  const v=world.clone().project(cam);
  const a=world.clone().add(V3(0,CH/2,0)).project(cam);
  const b=world.clone().add(V3(0,-CH/2,0)).project(cam);
  const y1=(-a.y*.5+.5)*VH, y2=(-b.y*.5+.5)*VH;
  ctx.globalAlpha=alpha*((Math.floor(T/330)%2)?.12:1);
  ctx.fillStyle=CLAYC;
  ctx.fillRect((v.x*.5+.5)*VW-1.5*PXS,y1,3*PXS,y2-y1);
  ctx.globalAlpha=1;
}
/* a point on the z=0 plane that projects to these screen pixels */
function s2w(px,py){
  const v=V3((px/VW)*2-1,-(py/VH)*2+1,.5).unproject(cam);
  const d=v.sub(cam.position).normalize();
  return cam.position.clone().add(d.multiplyScalar(-cam.position.z/d.z));
}

/* ------------------------------------------------------------------ clock */
let run=0, paused=false, drifting=true, GT=0;
function clock(ms,onTick){
  const me=run;
  return new Promise(res=>{
    let el=0,last=performance.now();
    (function step(t){
      if(me!==run) return res();
      const dt=t-last; last=t; if(!paused) el+=dt;
      onTick(Math.min(1,el/ms),el);
      el>=ms?res():requestAnimationFrame(step);
    })(last);
  });
}
const sleep=ms=>clock(ms,()=>{});
function frame(now){
  requestAnimationFrame(frame);
  if(!paused) GT=now;
  for(const n of NODES){
    n.p.set(n.h.x,n.h.y,n.h.z);
    if(drifting&&n.dr){
      n.p.x+=Math.sin(now*n.sp+n.ph[0])*n.am*n.dr;
      n.p.y+=Math.sin(now*n.sp*1.17+n.ph[1])*n.am*.7*n.dr;
      n.p.z+=Math.sin(now*n.sp*0.83+n.ph[2])*n.am*1.4*n.dr;
    }
  }
  const a=Math.sin(now*.00017)*CAMA;
  cam.position.set(Math.sin(a)*CAMR,CAMY+Math.sin(now*.00011)*CAMB,Math.cos(a)*CAMR);
  cam.lookAt(LOOK);
  sync(); renderer.render(scene,cam); labels();
}

/* ------------------------------------------------------------ the pieces */
/* The question's words sit on a line, GAP apart. Fixed at 100 that line runs
   off the stage the moment a question has more than about seven words, so it
   closes up for longer ones instead. */
let GAP=118;
/* The box used to be a fixed wide slab, which is right on a desktop stage and
   wrong on a phone, where the space available is tall and narrow. Its shape
   and the camera distances now come from the stage's own proportions, so the
   same sequence fills whichever it is given. */
let RX=400, RY=150, RZ=190;
let CAM2=620, CAM3=900, ENDR=640;
const ORBIT=.16;            /* how far the box turns while it is read */
let COLS=1;                 /* question words per row in steps one and two */
let ROWG=168;               /* and how far apart those rows sit */
/* where the i-th question word sits while its neighbourhood is around it */
function seat(i){
  const r=Math.floor(i/COLS), c=i%COLS, rows=Math.ceil(NQ/COLS);
  const wide=Math.min(COLS, NQ-r*COLS);        /* a short last row centres */
  return { x:(c-(wide-1)/2)*GAP, y:-(r-(rows-1)/2)*ROWG };
}
const TANH=()=>Math.tan(cam.fov*Math.PI/360);
/* The distance at which something of these half-extents fits the frame.
   mz is its half-depth, and leaving it out is what cropped the box: the near
   face sits mz CLOSER than the centre, so its corners project as though the
   thing were d/(d-mz) times wider. Standing the camera off by the depth as
   well as the width is the whole correction. */
function fitCam(mx,my,pad,mz){
  const t=TANH(), A=VW/VH;
  return (mz||0) + Math.max(my*pad/t, mx*pad/(t*A));
}
/* and for the box, which also turns while it is being looked at: at orbit
   angle a it presents a wider face and a deeper one than its own half-extents */
function fitBox(rx,ry,rz,orbit,bob,pad){
  const c=Math.abs(Math.cos(orbit)), si=Math.abs(Math.sin(orbit));
  return fitCam(rx*c+rz*si, ry+bob, pad, rx*si+rz*c);
}
function fitStage(){
  const A=VW/VH;
  const wide=cl((A-.70)/(1.85-.70));      /* 0 on a tall phone, 1 on a desktop */
  RX=lerp(205,400,wide); RY=lerp(315,180,wide); RZ=lerp(128,146,wide);
  /* shallower than it was, because depth costs camera distance twice over:
     once to clear the near face and again to hold the turn */
  CAM3=fitBox(RX,RY,RZ,ORBIT,32,1.05);
  ENDR=fitCam(RX*.58,RY*.58,1.12,RZ*.58);
}
const LINE_Y=104, SCALE=1.05, PER=1600;
const pct=p=> p>=.995 ? (Math.floor(p*1000)/10).toFixed(1)+"%"
            : p>=.1    ? (p*100).toFixed(0)+"%"
            : p>=.001  ? (p*100).toFixed(1)+"%"
            : p>=.00005? (p*100).toFixed(2)+"%" : "<0.01%";
/* Where the network folds down to. This used to be derived from the reply's
   first word, back when the reply was drawn here as a line of 3D words: the
   caret sat just left of it. The reply is written in the thread now, and the
   line it was measured from grew from six words to the whole answer, which
   pushed that measurement clean off the side of the stage. Nothing in the
   canvas depends on the reply any more, so the fold lands in the middle. */
let CARET=V3(0,LINE_Y,0);

/* One line, outside the stage, next to the thinking mark. It used to be two
   lines inside the frame narrating the animation; what belongs beside a
   loading indicator is what the machine is doing, not what the picture is
   doing. */
function hud(main){
  const h=$("hud"); if(!h) return;
  h.textContent=main||"";
}

/* =================================================================== build */
let recs, nodes, lay, cube, cubeHome, pins, stubs, words, kids, concepts, vis;
function buildCloud(){
  /* A hundred and thirty words at a legible size do not fit a phone. Type
     that shrinks to fit is not a fix, it is the same problem written smaller,
     so the cloud thins out instead and what is left can be read. */
  const DENSE=cl((VW-330)/(880-330));
  const POOL=Math.round(lerp(15,48,DENSE)), KIDS=Math.round(lerp(5,13,DENSE));
  recs=[];
  G.q.forEach((d,i)=>recs.push({w:d.w,role:0,parent:i,xy:null,rel:1,h3:hash3(d.w)}));
  G.q.forEach((d,i)=>d.assoc.slice(0,KIDS).forEach((a,k)=>
    recs.push({w:a.w,role:1,parent:i,k,xy:a.xy,rel:rel1(a.xy),h3:hash3(a.w)})));
  const best=new Map();
  G.reply.forEach(r=>r.cands.forEach(cd=>{const k=(cd.w||"").trim();
    if(k) best.set(k,Math.max(best.get(k)||0,cd.p));}));
  const seen=new Set(recs.map(r=>r.w.toLowerCase())), pool=[];
  const take=w=>{const k=(w||"").toLowerCase();
    if(/^[A-Za-z][A-Za-z'-]{1,}$/.test(w)&&!seen.has(k)){seen.add(k);pool.push(w);}};
  G.emerge.forEach(take); G.reply.forEach(r=>r.cands.forEach(cd=>take((cd.w||"").trim())));
  pool.slice(0,POOL).forEach(w=>recs.push({w,role:2,parent:-1,h3:hash3(w),
    rel:cl(Math.pow(best.get(w)||.003,.18))}));
  const cnt=[0,0,0];
  recs.forEach(r=>r.ord=cnt[r.role]++);
  recs.forEach(r=>r.ordN=cnt[r.role]);
  /* a word belongs to a view only where that view can say something true
     about it: the reply's own concepts have no source word and no measured
     direction, so they sit out those two */
  recs.forEach(r=>r.vis=[r.role!==2,true,r.role!==2,true]);

  const ang=r=>r.xy?Math.atan2(r.xy[1],r.xy[0]):r.h3[0]*6.283;
  const fib=(i,n,rad)=>{const u=(i+.5)/n,ph=Math.acos(1-2*u),th=i*2.39996;
    return V3(Math.sin(ph)*Math.cos(th)*rad*RX,Math.cos(ph)*rad*RY,
              Math.sin(ph)*Math.sin(th)*rad*RZ);};
  const LAYOUTS=[
    r=>{ if(r.role===2) return fib(r.ord,r.ordN,.99);
      const c=fib(r.parent,NQ,.52);
      if(r.role===0) return c;
      const R=22+(1-r.rel)*38, th=ang(r);
      return V3(c.x+Math.cos(th)*R*.75,c.y+Math.sin(th)*R*.95,c.z+r.h3[2]*2.6*R); },
    /* the question's own words used to sit at radius .10, which on any small
       stage is six words in the same spot. Far enough out to be told apart,
       still nearer the middle than anything they attracted. */
    r=>{ const rad=(r.role===0?.34:(1-r.rel))*.97, th=ang(r);
      const ph=Math.acos(cl(r.h3[2]*2,-1,1));
      return V3(Math.sin(ph)*Math.cos(th)*rad*RX,Math.cos(ph)*rad*RY,
                Math.sin(ph)*Math.sin(th)*rad*RZ); },
    r=>{ const th=ang(r), rad=r.role===0?.36:.93;
      return V3(Math.cos(th)*rad*RX,
                (r.role===0?(r.parent-(NQ-1)/2)*.5:r.h3[1]*2.1)*RY*.42,
                Math.sin(th)*rad*RZ); },
    r=>fib(r.ord,r.ordN,[.24,.64,.98][r.role])
  ];
  const K=LAYOUTS.length;
  lay=recs.map(r=>LAYOUTS.map(f=>f(r)));
  const pc=(a,q)=>{const b=a.slice().sort((x,y)=>x-y);
    return b[Math.min(b.length-1,Math.floor(b.length*q))]||1;};
  for(let k=0;k<K;k++){
    const live=lay.filter((L,j)=>recs[j].vis[k]).map(L=>L[k]);
    const f=[RX*.98/pc(live.map(v=>Math.abs(v.x)),.88),
             RY*.98/pc(live.map(v=>Math.abs(v.y)),.88),
             RZ*.98/pc(live.map(v=>Math.abs(v.z)),.88)];
    lay.forEach(L=>L[k].set(cl(L[k].x*f[0],-RX,RX),cl(L[k].y*f[1],-RY,RY),
                            cl(L[k].z*f[2],-RZ,RZ)));
  }
  /* step-2 home: each word in its seat, its neighbourhood around it in depth */
  recs.forEach(r=>{
    if(r.role===0){ const t=seat(r.parent); r.p2=V3(t.x,t.y,0); return; }
    if(r.role===2){ r.p2=null; return; }
    const a=seat(r.parent);
    const R=36+(1-r.rel)*30, th=ang(r);
    r.p2=V3(a.x+Math.cos(th)*R, a.y+Math.sin(th)*R*1.45, (r.rel-.45)*200);
  });
  nodes=recs.map((r,j)=>{
    const st=r.p2||lay[j][0];
    const n=mkNode(r.w,st.x,st.y,st.z,0);
    n.size=r.role===0?1.46:(r.role===1?1.0:.96);
    n.bold=r.role===0;
    n.base3=[1,.68,.60][r.role];
    n.rec=r; r.n=n; return n;
  });
  words=recs.filter(r=>r.role===0).map(r=>r.n);
  kids=recs.filter(r=>r.role===1);
  concepts=recs.filter(r=>r.role===2);
  return K;
}

/* =================================================================== play */
async function play(data){
  if(data) G=data;
  if(!G) return;
  NQ=G.q.length;
  note();
  const me=++run;
  paused=false; $("pause").textContent="Pause";
  NODES.length=0; EDGES.length=0; HITS.length=0; LATE=null;
  lineMat.blending=THREE.AdditiveBlending; lineMat.needsUpdate=true;
  fitStage();
  /* Steps one and two seat the question's words with room around each for
     its neighbourhood. Six of those will not fit across a phone at a size
     anyone can read, so the line wraps, the way the question itself wraps in
     the bubble above. The camera is then backed off to hold whatever shape
     that came out as, which is what makes it fill the stage rather than
     float small in the middle of it. */
  COLS = (VW/VH) >= 1.45 ? NQ
       : Math.max(2, Math.min(NQ, Math.round(Math.sqrt(NQ*(VW/VH)*1.6))));
  const rows = Math.ceil(NQ/COLS);
  /* the width decides how far back the camera stands, and the rows then open
     out to use whatever height that leaves, rather than huddling in a band
     across the middle of a tall stage */
  /* the neighbourhoods carry ±100 of depth, which counts the same way */
  CAM2 = fitCam((COLS-1)/2*GAP + 95, 0, 1.08, 105);
  ROWG = rows > 1 ? cl((TANH()*CAM2 - 118)*2/(rows-1), 150, 300) : 168;
  CAMR=CAM2; CAMA=0; CAMB=0; CAMY=0; LOOK=V3(0,0,0); BOXR=[RX,RY,RZ];
  resize();
  /* Where the answer begins. The fold has to end on the spot the first word
     will occupy, or the cursor appears in one place and the writing starts in
     another. Derived from the seat the camera finishes the fold in, so it
     stays put whatever the stage is sized to. */
  {
    const hH=ENDR*Math.tan(cam.fov*Math.PI/360), hW=hH*(VW/VH);
    CARET=V3(-hW+22, 22+hH-34, 0);
  }
  const K=buildCloud();

  /* the question, as it was typed */
  const qel=$("q"); qel.innerHTML=""; qel.style.opacity=0;
  const marks=G.prompt.split(/(?=\s)/).map(w=>{
    const b=document.createElement("b"); b.textContent=w; qel.appendChild(b); return b;});
  await sleep(120); if(me!==run) return;
  qel.style.opacity=1;
  await sleep(760); if(me!==run) return;

  /* ---------- 1 · the words come across ---------- */
  $("step").textContent="1 / 5";
  hud("tokenizing the prompt");
  const sr=stageEl.getBoundingClientRect();
  words.forEach((n,i)=>{
    const mk=marks.find(b=>b.textContent.trim()===recs[i].w)||marks[i];
    const r=mk.getBoundingClientRect();
    const st=s2w(r.left+r.width/2-sr.left,r.top+r.height/2-sr.top);
    n.h.copy(st); n.from=st.clone(); n.to=recs[i].p2.clone();
    setTimeout(()=>mk.classList.add("sent"),i*110+60);
  });
  await clock(NQ*110+620,(_,el)=>{
    words.forEach((n,i)=>{
      const k=out(cl((el-i*110)/560));
      n.h.lerpVectors(n.from,n.to,k); n.op=k;
    });
  });
  if(me!==run) return;
  marks.forEach(b=>b.classList.add("sent"));

  /* ---------- 2 · each word inside its neighbourhood ---------- */
  $("step").textContent="2 / 5";
  hud("looking up each token's embedding");
  /* the ten closest show here; the rest of each neighbourhood joins the cloud */
  const shown=new Map();
  G.q.forEach((d,i)=>{
    const ks=kids.filter(r=>r.parent===i).sort((a,b)=>b.rel-a.rel).slice(0,10);
    ks.forEach(r=>{ shown.set(r,1);
      const e=mkEdge(words[i],r.n,GREY,0,r.rel); r.e2=e; });
  });
  const STEP=230;
  await clock((NQ-1)*STEP+900,(_,el)=>{
    G.q.forEach((d,i)=>{
      const t0=i*STEP, k=io(seg(el,t0,t0+620));
      words[i].warm=io(seg(el,t0+120,t0+520));
      kids.filter(r=>r.parent===i&&shown.has(r)).forEach(r=>{
        r.n.op=k*(.17+r.rel*.55);
        r.n.dr=.40; r.n.am=6.5;
        r.n.size=.88+r.rel*.34;
        if(r.e2) r.e2.op=k*(.25+r.rel*.6);
      });
    });
  });
  if(me!==run) return;
  await sleep(900); if(me!==run) return;

  /* ---------- into the box ---------- */
  hud("960 dimensions, projected down to 3");
  /* the rest of the structure, built now and revealed by the move */
  const live=recs.map((r,j)=>j);
  for(let k=0;k<K;k++){
    const inK=live.filter(j=>recs[j].vis[k]);
    const made=new Set();
    const join=(i,j,w)=>{
      const key=Math.min(i,j)+":"+Math.max(i,j);
      if(made.has(key)) return; made.add(key);
      const e=mkEdge(nodes[i],nodes[j],GREY,0,w); e.layer=k;
      e.rad=(lay[i][k].length()+lay[j][k].length())*.5;
    };
    inK.forEach(i=>{
      inK.map(j=>j===i?null:{j,d:lay[i][k].distanceTo(lay[j][k])}).filter(Boolean)
        /* nearer neighbours bind harder, and now look it */
        .sort((p,q)=>p.d-q.d).slice(0,4).forEach((o,k)=>join(i,o.j,.62-k*.11));
    });
    for(let n=0;n<Math.round(inK.length*.3);n++){
      const i=inK[(Math.random()*inK.length)|0];
      const far=inK.filter(j=>j!==i&&lay[i][k].distanceTo(lay[j][k])>RX*.55);
      if(far.length) join(i,far[(Math.random()*far.length)|0],.16);
    }
  }
  /* contact with the wall: one stub per outer word, landing on a face */
  stubs=[];
  recs.map((r,j)=>({j,d:lay[j][0].length()})).filter(o=>recs[o.j].role>0)
    .sort((a,b)=>b.d-a.d).slice(0,46).forEach(o=>{
      const pin=mkNode("",0,0,0,0); pin.base3=0; pin.dr=0;
      lay.push(lay[o.j].map(v=>faceHit(v,[RX,RY,RZ])));
      nodes.push(pin); recs.push({role:3,vis:recs[o.j].vis,n:pin});
      const e=mkEdge(nodes[o.j],pin,GREY,0,.4); e.stub=1; e.ph=Math.random(); e.own=o.j;
      stubs.push(e); HITS.push({n:pin,e});
    });
  cube=[];
  for(const sx of[-1,1])for(const sy of[-1,1])for(const sz of[-1,1]){
    const n=mkNode("",sx*RX,sy*RY,sz*RZ,0); n.base3=0; cube.push(n);
  }
  [[0,1],[0,2],[0,4],[1,3],[1,5],[2,3],[2,6],[3,7],[4,5],[4,6],[5,7],[6,7]]
    .forEach(([a,b])=>{const e=mkEdge(cube[a],cube[b],WIRE,0,.22); e.frame=1;});
  cubeHome=cube.map(n=>n.h.clone());
  /* pins and cube start where the first layout puts them */
  nodes.forEach((n,j)=>{ if(recs[j].role===3) n.h.copy(lay[j][0]); });

  const from=nodes.map((n,j)=>recs[j].role===3?lay[j][0].clone()
              :(recs[j].p2?recs[j].p2.clone():lay[j][0].clone()));
  const op0=nodes.map(n=>n.op);
  await clock(1700,(_,el)=>{
    const k=io(seg(el,0,1500));
    CAMR=lerp(CAM2,CAM3,k); CAMA=lerp(0,ORBIT,k); CAMB=lerp(0,30,k);
    nodes.forEach((n,j)=>{
      const r=recs[j];
      n.h.lerpVectors(from[j],lay[j][0],k);
      if(r.role===3) return;
      n.op=lerp(op0[j],r.vis[0]?n.base3:0,k);
      n.dr=0;
      if(r.role===1) n.size=lerp(n.size,1.0,k);
      if(r.role===0) n.warm=1;
    });
    EDGES.forEach(e=>{ if(e.frame) e.op=k*.62;
                       else if(!e.layer&&e.layer!==0) e.op=(1-k)*(e.op||0); });
  });
  if(me!==run) return;
  recs.forEach(r=>{ if(r.e2) r.e2.op=0; });

  /* ---------- 3 · the same space, along different axes ---------- */
  $("step").textContent="3 / 5";
  /* What the pass is doing, in the fewest words that are still true. */
  /* These are not four pictures of the same thing. Each reads a different
     slice of the space the words are held in, and what falls near what
     changes with the slice. That is the whole method: meaning is a position
     in a space with far more directions than a screen has. */
  const NAMES=[
    "associating in dimensions 1-3 of 960",
    "dimensions 4-6: other words fall together",
    "dimensions 7-9: finer distinctions",
    "dimensions 10-12: the last with signal",
  ];
  const MOVE=950, WIRE_T=1500, REST=340;
  /* How long one connection takes to flare and settle. It has to be short
     next to the spread of start times below, or the band of lit edges is as
     wide as the cloud and the wiring reads as the whole thing blinking on
     rather than as something travelling outward from the middle. */
  const PULSE=260;
  /* Fired in a random order the cloud read as noise rather than as something
     spreading, so each edge now takes its turn from how far out it sits. A
     fifth of the timing stays random: pure radius order wires in visible
     concentric shells, which reads as mechanical. */
  for(let k=0;k<K;k++){
    const ly=EDGES.filter(e=>e.layer===k);
    const mx=Math.max(1,...ly.map(e=>e.rad));
    ly.forEach(e=>{ const f=cl(e.rad/mx);
      e.t0=MOVE*.55+WIRE_T*(.05+.72*(.82*f+.18*Math.random()));
      /* Not every connection flares. All of them lighting up read as noise,
         and the ones worth seeing are the short ones: a word reaching its own
         neighbours rather than across the whole cloud. */
      e.lit=Math.random() < .30+.34*(1-f); });
  }
  /* The first pass wires the layout the words have just arrived in. Treating
     it as a morph meant the move was skipped but its DESTINATION was not, so
     the cloud jumped straight to the second layout the instant step three
     began. That was the snap. */
  const CYCS=[[0,0,true]];
  for(let c=0;c<K-1;c++) CYCS.push([c,c+1,false]);
  const CLAYPAIR=[CLAY,CLAYC];
  const allN=nodes.concat(cube), base=allN.map(n=>n.h.clone());
  const c0=[CAMR,CAMA,CAMB];
  for(let ci=0;ci<CYCS.length;ci++){
    const [i,nx,still]=CYCS[ci], LASTC=ci===CYCS.length-1;
    const DUR=still?WIRE_T+REST:MOVE+WIRE_T+REST;
    nodes.forEach((n,j)=>{ if(recs[j].role) n.clay=false; });
    if(LASTC){
      /* Nothing settles here. The camera carries on orbiting straight into the
         fold, and the mesh stays the grey it happens to be: the warm to clay
         belongs to the fold, which opens on a grey cloud and colours it while
         it closes. Only the blending has to change in advance, because the
         moment every line lands on one path additive would sum past clay. */
      lineMat.blending=THREE.NormalBlending; lineMat.needsUpdate=true;
    }
    await clock(DUR,(_,el)=>{
      const tm=still?el+MOVE:el;
      const k=io(seg(tm,0,MOVE));
      /* the accent crosses over with the shape */
      const from=still?CLAYPAIR:VIEWC[i], to=VIEWC[nx];
      blendAcc(from,to,k);
      const sc=1;
      nodes.forEach((n,j)=>{
        const r=recs[j];
        n.h.lerpVectors(lay[j][i],lay[j][nx],k).multiplyScalar(sc);
        if(r.role===3) return;
        n.op=n.base3*((r.vis[i]?1-k:0)+(r.vis[nx]?k:0));
      });
      /* The still first pass reads the same schedule the morphing passes do,
         but it begins at tm=MOVE, by which point the earliest edges were
         already part-way through their pulse: two fifths of the first cloud
         lit on frame one, which is what made it look jerky. Shifting the
         schedule by the amount the still pass skips starts it at zero. */
      const tw=tm-(still?MOVE*.45:0);
      const dir=(i%2)?1:-1;
      cube.forEach((n,j)=>n.h.copy(rotY(cubeHome[j],dir*(tm/DUR-.5)*.10)).multiplyScalar(sc));
      const wired=cl((tw-MOVE*.5)/(WIRE_T*.8));
      EDGES.forEach((e,ei)=>{
        if(e.frame) return;
        if(e.stub){
          const ow=recs[e.own];
          const vz=(ow.vis[i]?1-k:0)+(ow.vis[nx]?k:0);
          const len=e.a.p.distanceTo(e.b.p);
          /* the wall contacts are the outermost thing there is, so they
             arrive with the last and furthest of the words */
          const tf=MOVE*.55+WIRE_T*(.05+.72*(.90+.12*e.ph));
          const kk=seg(tw,tf,tf+PULSE);
          const amp=kk>0&&kk<1?Math.sin(kk*Math.PI):0;
          e.op=wired*.85*vz*cl((len-16)/26);
          e.col.setHex(amp>.25?ACC:GREY); e.w=.3+amp*.5;
        }else if(e.layer===i&&tm<MOVE*.8){
          e.op=(1-seg(tm,0,MOVE*.8))*.8; e.col.setHex(GREY); e.w=.32;
        }else if(e.layer!==nx){ e.op=0; }
        else{
          const kk=seg(tw,e.t0,e.t0+PULSE);
          const amp=kk>0&&kk<1?Math.sin(kk*Math.PI):0;
          const hot=e.lit&&amp>.22;
          e.op=kk*.84; e.col.setHex(hot?ACC:GREY); e.w=.32+amp*(e.lit?.52:.16);
          if(hot){ e.a.clay=true; e.b.clay=true; }
        }
      });
      const f=seg(tm,MOVE*.55,MOVE*1.08);
      const nm=NAMES[f>.5?nx:i];
      hud(nm);
    });
    if(me!==run) return;
  }

  /* ---------- 4 · compressed into the cursor ---------- */
  $("step").textContent="4 / 5";
  hud("32 layers, one forward pass");
  const R4=nodes.concat(cube);   /* the frame folds away with its contents */
  const xs=R4.map(n=>n.h.x), lo=Math.min.apply(null,xs), hi=Math.max.apply(null,xs);
  const ys=R4.map(n=>n.h.y), ylo=Math.min.apply(null,ys), yhi=Math.max.apply(null,ys);
  /* The bundle's width is derived, not guessed. The caret is drawn 3px wide
     and a line renders about 1px, so the outermost line CENTRES need to span
     2px, converted to world units at the caret's distance. Measured from the
     camera's FINAL seat, not its current one: the camera is still moving
     while this is being set up. */
  const ENDCAM=V3(0,0,ENDR);
  const pxw=VH/(2*ENDCAM.distanceTo(CARET)*Math.tan(cam.fov*Math.PI/360));
  const CW=2/pxw, TOP=CARET.y+9;
  const cam0=[CAMR,CAMA,CAMB,LOOK.y];
  R4.forEach((n,i)=>{ n.home=n.h.clone(); n.op0=n.op; n.size0=n.size; n.i4=i;
    n.rank=(n.home.x-lo)/((hi-lo)||1);
    n.v=(n.home.y-ylo)/((yhi-ylo)||1);
    n.sx=CARET.x+((i%7)/6-.5)*CW; });
  EDGES.forEach(e=>e.op0=e.op);
  /* what the fold inherits: a grey mesh, and words lit or not as step three
     left them. Held so the colour can be driven from it rather than replacing
     it, which is what let the stage open already clay. */
  const col0=EDGES.map(e=>e.col.clone());
  const warm0=R4.map(n=>n.warm===undefined?(n.clay?1:0):n.warm);
  const CC=new THREE.Color(CLAY);
  let said=0;
  await clock(3400,(_,t)=>{
    const close=io(seg(t,1700,2750));
    const packed=io(seg(t,800,2200));
    const gone=seg(t,3000,3220), bye=seg(t,120,620);
    /* The fold starts from wherever the camera happens to be, orbiting and
       off centre, and the camera finds its way head-on while the fold runs.
       Nothing waits for the shot. The cloud scales with the dolly so its
       apparent size holds until the fold itself takes it. */
    const warm=io(seg(t,850,2400));
    const ck=io(seg(t,0,1900)), sc=lerp(1,ENDR/CAM3,ck);
    CAMR=lerp(cam0[0],ENDR,ck); CAMA=lerp(cam0[1],0,ck); CAMB=lerp(cam0[2],0,ck);
    LOOK=V3(0,lerp(cam0[3],22,ck),0);
    BOXR=[RX*sc,RY*sc,RZ*sc];
    R4.forEach(n=>{
      /* One ramp, not two. The pull to the centre line and the ride up the
         box used to be separate windows 250ms apart, which read as the cloud
         squeezing flat and then, as a second move, rising. A word now travels
         diagonally: it goes in and up at once, and only the final squeeze into
         the caret's own 21px band is left as a beat of its own. */
      const k=io(cl((t-650-n.rank*620)/950)), g=k;
      const hx=n.home.x*sc, hy=n.home.y*sc, hz=n.home.z*sc;
      /* The staging band used to be 170px deep, which left three quarters of
         the climb to the final squeeze and so split the fold in two: in, then
         up. Shallow, the per-node ramp carries most of the rise itself and the
         squeeze is only a tightening. The top of the band stays on the caret's
         top edge, so nothing ever travels above it. */
      const yl=TOP-(1-n.v)*72, ry=hy+(yl-hy)*g;
      const yc=CARET.y+(n.v-.5)*CH;
      n.h.set(hx+(n.sx-hx)*k, ry+(yc-ry)*close, hz*(1-k));
      n.size=n.size0*(1-close*.94);
      n.warm=lerp(warm0[n.i4],1,warm);
      n.op=n.op0*(1-gone)*(1-.35*packed);
    });
    EDGES.forEach((e,ei)=>{
      e.col.copy(col0[ei]).lerp(CC,warm);
      e.op=e.op0*(1-gone)*(1-.45*packed)*(e.stub?1-bye:1);
    });
    /* The moment the cursor exists, the page stops saying it is thinking:
       the thinking mark hands over to the cursor, because from here it is
       answering rather than working out what to answer. */
    if(t>2450 && !said){ said=1; if(window.onCursor) window.onCursor(); }
    LATE=()=>{ if(t>2450) caret(CARET,seg(t,2450,2720),t); };
  });
  if(me!==run) return;
  NODES.length=0; EDGES.length=0; HITS.length=0;
  lineMat.blending=THREE.AdditiveBlending; lineMat.needsUpdate=true;
  /* two blinks before it answers */
  await clock(1320,(_,el)=>{ LATE=()=>caret(CARET,1,el); });
  if(me!==run) return;

  /* ---------- and out ----------
     The reply used to be drawn here, in the canvas, as 3D words on a line.
     It is written into the thread itself now: real text, wrapping over real
     lines, in the message where an answer belongs. A reply is not a thing to
     watch inside a frame, it is a thing to read.

     So the sequence ends on the blinking cursor it folded into, and the page
     takes over from there. What it hands back is where that cursor is, in
     page coordinates, so the writing can begin from exactly the spot the
     network became. */
  $("step").textContent="writing";
  hud("sampling from 49,152 candidates");
  const v=CARET.clone().project(cam);
  const r=stageEl.getBoundingClientRect();
  return { x:r.left+(v.x*.5+.5)*r.width, y:r.top+(-v.y*.5+.5)*r.height };
}

window.playRun=play;
window.stopRun=()=>{ run++; LATE=null; NODES.length=0; EDGES.length=0; HITS.length=0;
  ctx.clearRect(0,0,ov.width,ov.height); renderer.render(scene,cam); };
window.isPaused=()=>paused;
window.setPaused=v=>{paused=v;};
/* The provenance line has to change with the question, because the two kinds
   of run are honest about different things. A recorded question carries a real
   MDS projection of the embedding matrix. A typed one cannot: that table is
   not on this page. What it carries instead is measured rather than invented,
   and the wording says which is which rather than claiming the stronger one
   both times. */
function note(){
  const real = G && G.live
    ? "Your question was run through the model in this tab. Every candidate and "
      +"every share in step five is its own next-token distribution. The "
      +"neighbourhoods are measured too, but differently: a word sits where it "
      +"does because of how strongly each of your words predicts it, read off "
      +"the same forward pass. Direction therefore means words your question "
      +"predicts alike, not words near each other in the embedding matrix."
    : "The neighbourhoods are a real MDS projection of the model's embedding "
      +"matrix, sampled one per direction from each word's 45 nearest. The "
      +"candidates and their shares in step five are the model's actual "
      +"next-token distributions.";
  $("note").innerHTML="<b>What is real here.</b> "+real
   +" The box, the collapse and the spreading front are staging. The four sets "
   +"of axes in step three are named for what switching dimensions does, but the "
   +"data carries a two-dimensional projection, so those four views re-arrange "
   +"the same two numbers rather than reading new ones.";
}
window.setNote=note;
resize(); requestAnimationFrame(frame);

/* ---------------------------------------------------------------------------
   The thread.

   One question at a time gets the visualisation: the stage and the question
   bubble are single elements that move into whichever exchange is current,
   because the WebGL context cannot be cloned per turn. Older exchanges keep
   their text, which is what a chat thread shows anyway once the model has
   stopped thinking.
--------------------------------------------------------------------------- */

const SUGGEST = [
  "Why is the sky blue?",
  "What is a prime number?",
  "How does a fridge keep things cold?",
  "What makes bread rise?",
];

const MB = 270;   /* q4f16: 4-bit weights, fp16 embedding table */

const norm = s => s.toLowerCase().replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim();
const RECORDED = (window.SEEDS || []).filter(g => g && g.q && g.reply);
const findSeed = t => RECORDED.find(g => norm(g.prompt) === norm(t));
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));

let token = 0, last = null, LIVE = null, loading = null, okToLoad = false;
const log = $("log"), thread = $("thread");
const scroll = () => { thread.scrollTop = thread.scrollHeight; };
/* Scrolling to the bottom is right while text is arriving, and wrong when a
   400px stage has just appeared: that puts its top above the fold and the
   whole sequence plays out of sight. This brings a turn's top into view. */
function showTurn(t){
  if(!t) return;
  const r = t.getBoundingClientRect(), v = thread.getBoundingClientRect();
  thread.scrollTop += (r.top - v.top) - 14;
}

/* ---- turns ---- */
function turn(role){
  const t = document.createElement("div");
  t.className = "turn " + role;
  if(role === "bot"){
    const w = document.createElement("p");
    w.className = "who";
    const mark = document.createElement("span");
    mark.className = "think";
    mark.innerHTML = "<b></b><b></b><b></b>";
    w.appendChild(mark);
    t.appendChild(w);
    const h = $("hud");
    if(h){ claim(h, w); h.textContent = ""; }
  }
  log.appendChild(t); scroll();
  return t;
}
/* The caption, not the whole line. Setting textContent on .who wiped out the
   thinking mark and the caption element sitting inside it, which is how the
   mark vanished and every later turn found no #hud to write to. */
const who = (t, s) => { const h = t.querySelector("#hud"); if(h) h.textContent = s; };

/* The two single elements, handed from turn to turn. What they leave behind
   is a copy, so scrolling back still shows what was asked. */
function claim(el, host){
  if(el.parentNode && el.parentNode.id !== "park"){
    const still = el.cloneNode(true);
    still.removeAttribute("id");
    if(el.id === "stage") still.remove(); else el.parentNode.insertBefore(still, el);
  }
  host.appendChild(el);
}

function say(t, text, cls){
  const p = document.createElement("p");
  p.className = cls || "answer";
  p.textContent = text;
  t.appendChild(p); scroll();
  return p;
}

/* ---- the one question the page asks ---- */
function gate(t, text){
  return new Promise(resolve => {
    const g = document.createElement("div");
    g.className = "gate";
    g.innerHTML =
      "<p>Answering your own question means running the model itself, right here "
      + "in this tab. That needs its weights: <b>about " + MB + " MB</b>, downloaded "
      + "once and kept by your browser afterwards. Nothing you type is sent "
      + "anywhere.</p><div class='row'></div>";
    const row = g.querySelector(".row");
    const go = document.createElement("button");
    go.className = "go"; go.textContent = "Download and answer";
    const no = document.createElement("button");
    no.textContent = "Not now";
    row.append(go, no);
    t.appendChild(g); scroll();
    go.onclick = () => { g.remove(); okToLoad = true; resolve(true); };
    no.onclick = () => { g.remove(); say(t, "Left it. The suggested questions "
      + "below are already answered and need no download."); resolve(false); };
  });
}

/* ---- the model, on first need ---- */
async function provider(onPct){
  if(LIVE) return LIVE;
  window.onLiveStatus = (msg, bad) => { if(!bad && onPct) onPct(msg); };
  if(!loading) loading = (async () => {
    const m = await import("./live.js");
    const ok = await m.load();
    if(!ok) throw new Error((window.LIVE && window.LIVE.error) || "the model would not load");
    LIVE = m; return m;
  })();
  return loading;
}

/* ---- ask ---- */
async function ask(text){
  const my = ++token;
  if(window.stopRun) window.stopRun();

  const ut = turn("user");
  claim($("q"), ut);
  $("q").style.opacity = 0;

  const bt = turn("bot");
  bt.classList.add("working");
  who(bt, "thinking");

  const seed = findSeed(text);
  let G = seed;

  if(!G){
    if(!LIVE && !okToLoad){
      who(bt, "one thing first");
      bt.classList.remove("working");
      const yes = await gate(bt, text);
      if(!yes || my !== token) return;
      bt.classList.add("working");
      who(bt, "thinking");
    }
    const note = say(bt, "Getting the model.", "answer");
    try{
      const m = await provider(msg => { if(my === token) note.textContent = "Getting the model, " + msg + "."; });
      if(my !== token) return;
      note.textContent = "Reading your question.";
      const { q } = await m.associate(text);
      if(my !== token) return;
      const steps = await m.generate(text, undefined, (st, all) => {
        if(my === token) note.textContent = "Writing the answer, " + all.length + " words so far.";
      });
      if(my !== token) return;
      if(!steps.length) throw new Error("the model stopped before saying anything");
      G = { prompt: text, q, emerge: m.concepts(steps, q.map(x => x.w)),
            reply: m.toReply(steps), said: m.sayWhat(steps), live: true };
    }catch(e){
      if(my !== token) return;
      bt.classList.remove("working");
      who(bt, "could not answer");
      const blocked = /dynamically imported|fetch|network/i.test(e.message);
      note.textContent = blocked
        ? "The model's weights could not be fetched from here. The suggested "
          + "questions below are already answered and need no download."
        : e.message + ".";
      return;
    }
    note.remove();
  }

  if(my !== token) return;
  last = G;
  const st = $("stage");
  st.style.height = ""; st.style.opacity = "";
  claim(st, bt);
  /* twice: once now, and once after layout has taken the stage's height */
  showTurn(bt);
  requestAnimationFrame(() => showTurn(bt));
  bt.classList.remove("working");
  who(bt, "");
  answering = bt;
  const at = await window.playRun(G);
  if(my !== token) return;
  await collapse($("stage"));
  if(my !== token) return;
  await writeReply(bt, G, my, at);
  if(my !== token) return;
  /* the controls belong under the finished message, the way a chat puts copy
     and retry there, not above an answer that has not been written yet */
  bt.classList.add("spoken");       /* the caption has nothing left to report */
  actions(bt);
  inspector(bt.querySelector(".reply"));
  scroll();
}

/* The engine says when the cursor exists. From that moment the page is
   answering, not working out what to answer. */
let answering = null;
window.onCursor = () => { if(answering) answering.classList.add("answering"); };

/* The sequence folded the whole network into a blinking cursor. The cursor
   is what writes, so the stage closes rather than sitting there as a spent
   frame, and the reply picks up in the thread. */
function collapse(stage){
  return new Promise(r => {
    const h = stage.offsetHeight;
    stage.style.height = h + "px";
    void stage.offsetHeight;                 /* let the start height stick */
    requestAnimationFrame(() => {
      stage.style.height = "0px";
      stage.style.opacity = "0";
    });
    setTimeout(() => { stage.style.height = ""; stage.style.opacity = "";
                       stage.remove(); $("park").appendChild(stage); r(); }, 640);
  });
}

const FAN_N = 6;        /* candidates shown per word */
/* The field opens to the RIGHT of the word, where a line of text has room,
   and settles underneath only once the word has been taken. Opening
   downwards meant the band had to be as deep as the field was tall, and the
   collapse into finished prose was a long way to fall. */
/* A fan, not a list. Stepping each candidate the same distance right and the
   same distance down drew six parallel lines at one angle, which is an angled
   list wearing a fan's clothes. They now sit on an arc that opens above and
   below the word, at reaches that differ per candidate, so the lines leave at
   real angles and real lengths. */
/* Direction and distance are two channels, and both were carrying rank, so
   the fan came out a ladder: shortest at the top, longest at the bottom,
   every word the same shape. They now carry different things.

   DISTANCE still carries probability, as surprisal, so a word the model was
   almost certain of sits right against the line and a long shot is flung out.
   Rank is mixed in at 45% only to keep neighbours from landing on top of each
   other when five candidates share nearly the same tiny probability.

   DIRECTION carries what KIND of word it is, which is real and has nothing to
   do with how likely it was. Punctuation leaves upward, word-pieces next,
   then ordinary words, then capitals downward. So the alternatives sort
   themselves by what they would have DONE to the sentence, and the same kind
   of word always leaves the same way, across the whole reply.

   SPREAD carries certainty: the arc is narrow where the model knew what came
   next and swings wide open where it did not. That is the reading available at
   a glance, before any single word is looked at. */
const FAN_SPAN0 = 76, FAN_SPAN1 = 116;  /* degrees of arc: certain, uncertain */
const FAN_MINY = 15;                    /* px, two rows may never sit closer */
const FAN_TILT  = -6;                   /* the arc's centre line, just below level */
const FAN_R0 = 44, FAN_R1 = 122;        /* and how far out each reaches */
/* cl() is the engine's clamp, declared above in the built page */
/* 0 up through 3 down. A candidate that is punctuation would have closed the
   clause; one or two characters is the model starting to spell a different
   word; a capital would have begun something new. */
const stem = (a, b) => {
  let n = 0;
  while(n < a.length && n < b.length && a[n].toLowerCase() === b[n].toLowerCase()) n++;
  return n;
};
const kindOf = w => /^[^0-9A-Za-z]/.test(w) ? 0
                  : w.length <= 2          ? 1
                  : /^[A-Z]/.test(w)       ? 3
                  :                          2;
/* a stable wobble per word, so the arc is never mechanically even and the
   same word always sits the same way */
const wobble = w => {
  let h = 2166136261;
  for(let i = 0; i < w.length; i++){ h ^= w.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 1000) / 1000 - .5;
};
const REST_GAP = 4, REST_ROW = 11;   /* these two match --gap and --row */
const MAX_CH = 13;      /* a long one is clipped so it cannot shove the line apart */
const pause = ms => new Promise(r => setTimeout(r, ms));
const share = p => p >= .995 ? (Math.floor(p * 1000) / 10).toFixed(1) + "%"
               : p >= .1   ? (p * 100).toFixed(0) + "%"
               : p >= .001 ? (p * 100).toFixed(1) + "%"
               : p >= .00005 ? (p * 100).toFixed(2) + "%" : "<0.01%";
const bitsOf = p => Math.log2(1 / Math.max(p, 1e-9));
const el = (t, c) => { const e = document.createElement(t); if(c) e.className = c; return e; };

/* One word: the field it was chosen from, and the word rising out of it. */
function buildTok(step){
  const tok = el("span", "tok");
  const word = el("span", "word");
  word.textContent = step.tok;
  tok.appendChild(word);

  const field = step.cands.slice(0, FAN_N);
  const clip = w => w.length > MAX_CH ? w.slice(0, MAX_CH - 1) + "\u2026" : w;
  /* the line spaces itself so every field has somewhere to sit, plus a little
     over, because words butted together read as one word */
  const widest = Math.max(step.tok.length, ...field.map(c => clip(c.w).length));
  tok.style.setProperty("--pad",
    (0.45 + (widest - step.tok.length) / 2).toFixed(2) + "ch");

  /* how wide the whole arc opens: how surprised the model was by its own
     first choice, which is the plainest certainty figure the piece has */
  const span = FAN_SPAN0 + (FAN_SPAN1 - FAN_SPAN0)
                         * cl(bitsOf(field[0].p) / 3.2);

  /* Where each one leaves. Kind pulls it toward its own quarter of the arc,
     and an even share of the arc keeps it off its neighbours: kind alone put
     four capitals on the same ray, stacked at nearly equal reach, which is a
     collision rather than a grouping. Order is by kind, so the quarters still
     read top to bottom even when the even share dominates. */
  const rank = i => {
    const w = field[i].w;
    /* a candidate sharing a stem with the word taken is a near miss, a
       different ending on the same thought, so it sits next to it; a word
       that shares nothing is a real fork and swings away. After that, by how
       long the word is, which is the one thing left that is a property of the
       candidate rather than of its odds. */
    return kindOf(w) * 100 + (stem(w, step.tok) >= 3 ? 0 : 40)
         + Math.min(w.length, 14) * 2;
  };
  const order = field.map((c, i) => i).sort((a, b) => rank(a) - rank(b) || a - b);
  const place = field.map((c, i) => {
    const slot  = field.length > 1 ? order.indexOf(i) / (field.length - 1) : .5;
    const u     = .68 * slot + .32 * (kindOf(c.w) + .5) / 4;
    const f     = field.length > 1 ? i / (field.length - 1) : 0;
    return {
      a: FAN_TILT + span * (.5 - u) + wobble(c.w) * span * .11,
      R: FAN_R0 + (FAN_R1 - FAN_R0)
                * (.55 * cl(bitsOf(c.p) / 8) + .45 * f) + wobble(c.w) * 16
    };
  });
  /* and a last pass so nothing overlaps: reaches differ, but two rows on
     nearly the same ray still land on top of each other. Push the pair apart
     in the only direction that matters for reading, and keep the reach. */
  const ys = place.map((q, i) => ({ i, y: -Math.sin(q.a * Math.PI / 180) * q.R }))
                  .sort((m, n) => m.y - n.y);
  for(let i = 1; i < ys.length; i++){
    const d = ys[i].y - ys[i - 1].y;
    if(d < FAN_MINY){ ys[i].y += FAN_MINY - d; }
  }
  ys.forEach(({ i, y }) => {
    const q = place[i];
    q.a = -Math.asin(cl(y / q.R, -.94, .94)) * 180 / Math.PI;
  });

  const fan = el("span", "fan");
  field.forEach((c, i) => {
    const row = el("i");
    row.appendChild(document.createTextNode(clip(c.w)));
    const sh = el("s"); sh.textContent = share(c.p); row.appendChild(sh);
    /* opacity still carries probability, but off a higher floor: the long
       shots were landing near invisible, and a candidate worth nothing is
       still worth seeing */
    row.style.setProperty("--o", (.24 + Math.sqrt(c.p) * .66).toFixed(3));
    const a = place[i].a * Math.PI / 180, R = place[i].R;
    row.style.setProperty("--cx", "0%");       /* reach out to the right */
    row.style.setProperty("--x", (Math.cos(a) * R).toFixed(1) + "px");
    row.style.setProperty("--y", (-Math.sin(a) * R).toFixed(1) + "px");
    if(i === 0) row.classList.add("win");
    fan.appendChild(row);
  });
  tok.appendChild(fan);
  return { tok, fan, word };
}

/* One line from the word to each thing it might have been. Drawn after the
   token is in the document, because where the rows land depends on how wide
   their own text is, and that is only known once laid out. */
const NS = "http://www.w3.org/2000/svg";
function wires(tok, fan, step){
  const tb = tok.getBoundingClientRect();
  const rows = [...fan.children];
  if(!rows.length || !tb.width) return null;
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("class", "wires");
  const ox = tb.width / 2, oy = tb.height;      /* the word's bottom centre */
  let deepest = 0;
  rows.forEach((row, i) => {
    const rb = row.getBoundingClientRect();
    const x = rb.left - tb.left, y = rb.top - tb.top + rb.height / 2;
    deepest = Math.max(deepest, y);
    const ln = document.createElementNS(NS, "line");
    ln.setAttribute("x1", ox.toFixed(1)); ln.setAttribute("y1", oy.toFixed(1));
    ln.setAttribute("x2", (x - 3).toFixed(1)); ln.setAttribute("y2", y.toFixed(1));
    const p = step.cands[i] ? step.cands[i].p : 0;
    ln.setAttribute("stroke", i === 0 ? "#d97757" : "#8a8a8a");
    /* the likelier the candidate, the heavier the line to it */
    ln.setAttribute("stroke-width", (0.5 + Math.sqrt(p) * 2.1).toFixed(2));
    ln.setAttribute("stroke-opacity", (0.2 + Math.sqrt(p) * 0.68).toFixed(2));
    svg.appendChild(ln);
  });
  svg.setAttribute("width", Math.max(1, tb.width));
  svg.setAttribute("height", Math.max(1, deepest + 4));
  tok.appendChild(svg);
  return svg;
}

/* The reply, written into the thread a word at a time. Pace carries meaning:
   a word the model was sure of barely pauses, an uncertain one holds long
   enough that its field can be read. */
async function writeReply(bot, G, my, at){
  const p = el("p", "reply");
  const caret = el("span", "caret");
  p.appendChild(caret);
  bot.appendChild(p);
  scroll();

  for(const step of G.reply){
    if(my !== token) return;
    const { tok, fan } = buildTok(step);
    /* A real space between words, not just the padding that holds a field
       open. Padding alone spaces the line while it is being written and then
       has nothing to relax to, so the finished answer keeps animation gaps
       and its punctuation floats off on its own. */
    if(p.querySelector(".tok") && !/^[,.;:!?)\]'’]/.test(step.tok))
      p.insertBefore(document.createTextNode(" "), caret);
    p.insertBefore(tok, caret);
    scroll();

    const w = wires(tok, fan, step);
    fan.classList.add("in");
    if(w) w.classList.add("in");
    await pause(80);
    if(my !== token) return;
    await pause(Math.min(680, Math.max(70, bitsOf(step.cands[0].p) * 155)));
    if(my !== token) return;

    /* the one taken travels up and left onto the line; the rest slide left
       and down into the trace they leave behind */
    const rows = [...fan.children];
    const win = rows[0];
    win.style.setProperty("--cx", "-50%");
    win.style.setProperty("--x", "0px");
    win.style.setProperty("--y", (-(tok.offsetHeight - 2)) + "px");
    rows.forEach((row, i) => {
      if(i === 0) return;
      row.style.setProperty("--cx", "-50%");
      row.style.setProperty("--x", "0px");
      row.style.setProperty("--y", (REST_GAP + i * REST_ROW) + "px");
    });
    /* the lines go when the words they point at go, or the moment between
       the field fading and the row settling is a spray of naked lines */
    if(w) w.classList.remove("in");
    fan.classList.add("out");

    /* the share it was taken at, rising away: a few of them are in the air
       at once, so the line reads as a run of decisions rather than one */
    const lift = el("span", "lift");
    lift.textContent = share(step.cands[0].p);
    tok.appendChild(lift);
    requestAnimationFrame(() => lift.classList.add("go"));
    setTimeout(() => lift.remove(), 2700);

    await pause(300);
    if(my !== token) return;
    tok.classList.add("set");
    await pause(40);
    fan.classList.remove("in", "out");
    fan.classList.add("rest");
    rows.forEach((c, i) => { if(i && i < 4) c.classList.add("keep"); });
    win.style.setProperty("--x", "0px");
    win.style.setProperty("--y", REST_GAP + "px");
  }
  caret.remove();
  p.classList.add("done");
  scroll();
}

/* ---------------------------------------------------------------------------
   The finished answer, reopened.

   Every word still carries the field it was chosen from. Once the sentence
   has settled they are out of the way, but they are the whole point, so
   moving a pointer or dragging a finger along the line swells the words back
   open around wherever you are: full at the word itself, less either side,
   gone two words out. The line opens its band once so the fields have
   somewhere to be, and the bulge travels along inside it.
--------------------------------------------------------------------------- */
function inspector(p){
  if(!p) return;
  const toks = [...p.querySelectorAll(".tok")];
  if(!toks.length) return;
  let boxes = null;

  /* measured in the settled layout and held for the gesture: the words move
     as the bulge opens, and chasing their live positions makes the thing
     under the pointer squirm away from it */
  const measure = () => {
    boxes = toks.map(t => {
      const r = t.getBoundingClientRect();
      return { x:(r.left + r.right) / 2, y:(r.top + r.bottom) / 2, h:r.height };
    });
  };
  const apply = idx => {
    toks.forEach((t, i) => {
      const d = idx < 0 ? 99 : Math.abs(i - idx);
      /* room opens almost fully for the neighbours, so their fields have
         somewhere to go; how brightly those fields show falls away faster,
         so the word under the pointer is plainly the one being read */
      t.style.setProperty("--spread", d === 0 ? 1 : d === 1 ? .92 : d === 2 ? .7 : 0);
      t.style.setProperty("--mag",    d === 0 ? 1 : d === 1 ? .45 : d === 2 ? .16 : 0);
    });
    p.classList.toggle("inspect", idx >= 0);
  };
  const nearest = (x, y) => {
    if(!boxes) measure();
    let best = -1, bd = Infinity;
    boxes.forEach((b, i) => {
      const dy = Math.abs(b.y - y);
      if(dy > b.h * 1.3) return;                 /* another line */
      const d = Math.abs(b.x - x) + dy * .5;
      if(d < bd){ bd = d; best = i; }
    });
    return bd < 200 ? best : -1;
  };
  const move = (x, y) => apply(nearest(x, y));
  const off = () => { apply(-1); boxes = null; };

  p.addEventListener("pointerenter", measure);
  p.addEventListener("pointermove", e => {
    if(e.pointerType !== "touch") move(e.clientX, e.clientY);
  });
  p.addEventListener("pointerleave", off);
  p.addEventListener("touchstart", e => {
    measure(); const t = e.touches[0]; if(t) move(t.clientX, t.clientY);
  }, { passive:true });
  p.addEventListener("touchmove", e => {
    const t = e.touches[0]; if(t) move(t.clientX, t.clientY);
  }, { passive:true });
  p.addEventListener("touchend", off);
  p.addEventListener("touchcancel", off);
  addEventListener("resize", () => { boxes = null; });
}

function actions(t){
  if(t.querySelector(".acts")) return;
  const a = document.createElement("div");
  a.className = "acts";
  const mk = (key, label) => {
    const b = document.createElement("button");
    b.dataset.a = key; b.textContent = label;
    a.appendChild(b); return b;
  };
  /* Pause steered the sequence, which by now has finished and gone. Replay
     is the only thing left that means anything here. */
  mk("replay", "Replay").onclick = () => { if(last) ask(last.prompt); };
  t.appendChild(a);
}

/* ---- composer ---- */
function chips(){
  const all = RECORDED.map(g => g.prompt)
    .concat(SUGGEST.filter(s => !findSeed(s)));
  all.forEach(text => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = text;
    b.onclick = () => { openChips(false); chipHold = false; $("msg").blur(); ask(text); };
    li.appendChild(b); $("chips").appendChild(li);
  });
}
function submit(){
  const v = $("msg").value.trim();
  if(!v) return;
  $("msg").value = ""; $("send").disabled = true;
  openChips(false); $("msg").blur();
  ask(v);
}
/* The suggestions are shown when somebody reaches for the box, not before.
   A chip press has to survive the blur that the press itself causes, so a
   pointer going down on the list holds them open until the click lands. */
const bar = document.querySelector(".bar");
const openChips = v => bar.classList.toggle("open", v);
let chipHold = false;
$("chips").addEventListener("pointerdown", () => { chipHold = true; });
$("msg").addEventListener("focus", () => openChips(true));
$("msg").addEventListener("blur", () => setTimeout(() => {
  if(!chipHold) openChips(false);
  chipHold = false;
}, 60));

$("msg").addEventListener("keydown", e => { if(e.key === "Enter") submit(); });
$("msg").addEventListener("input", () => { $("send").disabled = !$("msg").value.trim(); });
$("send").onclick = submit;

/* ---------------------------------------------------------------------------
   Capture mode:  …/into-the-network/?capture

   The recorded questions have to be computed somewhere with the weights, and
   the only machine in this project that can reach them is whichever browser
   is reading this page. So it captures them itself: run each question once,
   and hand back a seeds.js to commit. Questions already recorded are kept
   untouched, because a capture made offline carries real embedding-matrix
   neighbourhoods and this one cannot.
--------------------------------------------------------------------------- */
/* The words a question should arrive with, by the rule the page uses now. A
   recorded question whose words do not match this was captured under an older
   rule, which is how "What is a prime number?" reached the screen as four
   words. Checking rather than assuming means a change to how words are found
   re-records exactly the questions it affects and leaves the rest alone. An
   offline capture carries neighbourhoods a browser cannot compute, so not
   overwriting one needlessly is worth the check. */
const typedWords = t => (t.match(/[A-Za-z][A-Za-z'-]*/g) || []).map(w => w.toLowerCase());
const stale = g => typedWords(g.prompt).join(" ") !== g.q.map(x => x.w.toLowerCase()).join(" ");

async function captureAll(){
  /* ?capture        fills in what is missing, and anything now out of date
     ?capture=all    records everything again, whatever its state */
  const all = /capture=all/.test(location.search);
  const want = RECORDED.map(g => g.prompt).concat(SUGGEST.filter(s => !findSeed(s)));
  const keep = new Map();
  if(!all) RECORDED.forEach(g => { if(!stale(g)) keep.set(norm(g.prompt), g); });
  const todo = want.filter(t => !keep.has(norm(t)));
  const t = turn("bot");
  who(t, "capture mode");
  if(!todo.length){ say(t, "Everything is already recorded."); return; }
  const old = todo.filter(x => RECORDED.some(g => norm(g.prompt) === norm(x)));
  const note = say(t, "About to capture " + todo.length + " question"
    + (todo.length === 1 ? "" : "s")
    + (old.length ? ", " + old.length + " of them recorded already but out of date" : "")
    + ". Keeping " + keep.size + " as they are. A few minutes; leave this tab open.");
  if(!okToLoad && !(await gate(t, ""))) return;
  const done = new Map();
  try{
    const m = await provider(msg => note.textContent = "Getting the model, " + msg + ".");
    for(const q of todo){
      note.textContent = "Capturing: " + q;
      const a = await m.associate(q);
      const steps = await m.generate(q, undefined, (st, all) => {
        note.textContent = "Capturing: " + q + "  (" + all.length + " words)";
      });
      done.set(norm(q), { prompt:q, q:a.q, emerge:m.concepts(steps, a.q.map(x => x.w)),
                 reply:m.toReply(steps), said:m.sayWhat(steps), from:"browser" });
      say(t, "\u2713 " + q + "\n   " + m.sayWhat(steps));
    }
  }catch(e){ note.textContent = "Stopped: " + e.message; return; }
  /* rebuilt in the order the chips are in, not the order they were captured */
  const out = want.map(t => done.get(norm(t)) || keep.get(norm(t))).filter(Boolean);
  const js = "window.SEEDS=" + JSON.stringify(out) + ";\n";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([js], { type:"text/javascript" }));
  a.download = "seeds.js";
  a.textContent = "Download seeds.js  (" + out.length + " questions, "
                + Math.round(js.length / 1024) + "KB)";
  a.style.cssText = "color:var(--clay);display:inline-block;margin-top:12px";
  t.appendChild(a);
  note.textContent = "Done. Commit this over build/into-the-network/seeds.js "
    + "and rebuild.";
  scroll();
}

chips();
if(location.search.includes("capture")) captureAll();

</script>
