<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What It Almost Said</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------------------
   The chat interface people already use, so the machinery underneath maps
   onto their own experience without being explained.

   The greys, the clay accent, the text opacities, the border, the radii and
   the composer geometry are measured values, not approximations. The face is
   the one exception: the real one is a licensed webfont, so this falls back
   to Inter and then to the same system stack the original falls back to.
--------------------------------------------------------------------------- */
:root{
  --page:#191919;        /* page background */
  --surface:#1f1f1f;     /* raised surface */
  --raised:#303030;      /* composer, and the asker's bubble */
  --ink:#ffffffed;       /* primary text, 93% */
  --dim:#ffffff91;       /* secondary, 57% */
  --dimmer:#ffffff66;    /* muted, 40% */
  --rule:#ffffff0a;      /* border, 4% */
  --rule-2:#ffffff14;
  --clay:#d97757;        /* the accent */
  --clay-hot:#c6613f;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --col:780px;         /* wider than the original column: each word has to
                          reserve room for the field hanging under it */
  --row:19px;          /* one candidate row */
  --gap:11px;          /* sentence baseline to the top of the field */
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--page)}
body{color:var(--ink);font-family:var(--sans);font-size:15px;line-height:21px;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}

header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  padding:13px 22px;border-bottom:1px solid var(--rule);flex:0 0 auto}
.mark{font-size:13px;color:var(--dim)}
.mark b{color:var(--ink);font-weight:500}
.status{font-family:var(--mono);font-size:10.5px;color:var(--dimmer);
  text-align:right;line-height:1.5}

#thread{flex:1 1 auto;overflow-y:auto;padding:28px 22px 12px}
#thread::-webkit-scrollbar{width:10px}
#thread::-webkit-scrollbar-thumb{background:#ffffff1f;border-radius:5px}
.inner{max-width:var(--col);margin:0 auto}

/* the asker on the right, in a bubble; the model on the left, full width.
   the same asymmetry the real thing uses. */
.turn{margin:0 0 28px}
.turn.user{display:flex;justify-content:flex-end}
.turn.user .who{display:none}
.turn.user .said{background:var(--raised);border-radius:14px;padding:10px 16px;
  max-width:76%;line-height:1.55;white-space:pre-wrap;word-break:break-word}

.turn.bot .who{display:flex;align-items:center;gap:9px;margin:0 0 12px;
  font-family:var(--mono);font-size:11px;color:var(--dimmer);letter-spacing:.01em}
/* a small clay mark stands where the assistant's avatar would be. it is a
   plain circle of my own, not anybody's logo, and it breathes while the
   model is still working. */
.turn.bot .who::before{content:"";flex:0 0 auto;width:13px;height:13px;
  border-radius:50%;background:var(--clay)}
.turn.bot.waiting .who::before{animation:clay-breathe 1.75s ease-in-out infinite}
.turn.bot .said{color:var(--dim);line-height:1.6;white-space:pre-wrap;word-break:break-word}

/* measured from the real interface: the loading mark scales and brightens
   rather than spinning or bouncing */
@keyframes clay-breathe{
  0%,100%{filter:brightness(.96);transform:scale(.86)}
  50%    {filter:brightness(1.06);transform:scale(1)}
}
@keyframes dot-pulse{
  0%,5%  {opacity:.3;animation-timing-function:cubic-bezier(.165,.84,.44,1)}
  15%,25%{opacity:1;animation-timing-function:cubic-bezier(.165,.84,.44,1)}
  65%,100%{opacity:.3}
}

/* The reply leaves a band under every line for the field of candidates.
   The band has to clear what actually hangs there, or the line below walks
   through it. A field opens at gap + 6 rows under the top of its word, and
   the word itself is a row tall, so the band is 7.4 rows, not 6.6. The
   leftover traces run 4 rows deep by the same arithmetic, so the settled
   band is 5.4, not 4.4. Both were too short and both collided. */
.reply{--band:calc(var(--gap) + 7.4 * var(--row));
  line-height:var(--band);
  /* the band is symmetric, so half of it also sits above the first line,
     which opened a dead gap under the model's name. pull that half back. */
  margin:calc((1.5em - var(--band)) / 2) 0 0;
  white-space:pre-wrap;word-break:break-word}
/* once finished, the band shrinks to just what the leftover traces need */
.reply.done{--band:calc(var(--gap) + 5.4 * var(--row));
  transition:line-height .55s cubic-bezier(.3,0,.2,1),
             margin-top .55s cubic-bezier(.3,0,.2,1)}

/* the token keeps a tight line box of its own, so the field hangs just under
   the glyph rather than under the whole opened line */
.tok{position:relative;display:inline-block;white-space:pre;vertical-align:baseline;
  line-height:1.25;text-align:center;
  padding-left:var(--pad,0);padding-right:var(--pad,0)}
.tok .word{display:inline-block;line-height:1.25;opacity:0;
  transition:opacity .14s ease,color .2s ease}
.tok.set .word{opacity:1}
.tok.set{cursor:pointer}
.tok.set:hover .word{color:var(--clay)}
.tok.sel .word{color:var(--clay);font-weight:500}

/* A word the person typed. The field under it is what the model expected
   there instead, and it sinks away because what they wrote overrules it.
   The clay underline carries how much that word surprised the model: no line
   means it had already guessed it, a bright one means it had not. */
.tok.given .word{box-shadow:inset 0 -1px 0 0 rgba(217,119,87,var(--surprise,0))}
.fan.sink i:not(.keep){transform:translateY(9px);opacity:0;
  transition:transform .45s cubic-bezier(.3,0,.2,1),opacity .4s ease}

/* the bubble breaks apart and its words rejoin the one sequence the model
   actually reads. the two-sided thread was always a surface over this. */
.turn.user .said{transition:opacity .4s ease,transform .45s cubic-bezier(.4,0,1,1)}
.turn.user.gone .said{opacity:0;transform:translateY(-6px) scale(.97)}
.turn.user.gone{margin-bottom:0;max-height:0;overflow:hidden;
  transition:max-height .45s cubic-bezier(.4,0,.2,1),margin-bottom .45s ease}

/* the field hangs below the word it belongs to */
.fan{position:absolute;left:50%;transform:translateX(-50%);top:calc(100% + var(--gap));
  display:flex;flex-direction:column;align-items:center;white-space:pre;pointer-events:none}
.fan i{font-style:normal;display:block;height:var(--row);line-height:var(--row);
  font-size:13.5px;color:#fff;opacity:0;
  transition:opacity .22s ease, transform .3s cubic-bezier(.3,0,.2,1)}
.fan.in i{opacity:var(--o,.3)}
.fan.rest i.keep{opacity:calc(var(--o,.3) * .3)}
.fan i.win{color:var(--clay);font-weight:500}
/* the one it took lifts out of the field and into the sentence */
.fan i.rise{transition:transform .3s cubic-bezier(.4,0,.2,1), opacity .3s ease;
  transform:translateY(var(--dy));opacity:1}
.fan.out i:not(.rise){opacity:0}
/* what is left behind once the line has moved on */
.fan.rest i{opacity:0}
.fan.rest i.keep{transition:opacity .6s ease}

.caret{display:inline-block;width:2px;height:1.05em;vertical-align:-.16em;
  background:var(--clay);border-radius:1px;animation:dot-pulse 1.4s ease-in-out infinite}

#inspect{flex:0 0 auto;max-height:0;overflow:hidden;border-top:1px solid transparent;
  transition:max-height .3s ease,border-color .3s ease;background:var(--surface)}
#inspect.on{max-height:250px;border-top-color:var(--rule)}
.ins{max-width:var(--col);margin:0 auto;padding:15px 22px}
.ins h4{margin:0 0 10px;font-family:var(--mono);font-size:11px;font-weight:400;color:var(--dimmer)}
.ins h4 b{color:var(--clay);font-weight:500}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:5px 12px;align-items:center;
  max-height:165px;overflow-y:auto}
.bars span{font-size:13px;white-space:pre}
.bars .t{color:var(--dim)} .bars .t.is{color:var(--clay);font-weight:500}
.bars .track{height:6px;background:#ffffff14;border-radius:3px;position:relative}
.bars .track i{position:absolute;inset:0 auto 0 0;background:#ffffff4d;border-radius:3px}
.bars .t.is + .track i{background:var(--clay)}
.bars .p{font-family:var(--mono);font-size:11px;color:var(--dimmer);
  font-variant-numeric:tabular-nums;text-align:right}

footer{flex:0 0 auto;padding:4px 22px 18px;background:var(--page)}
.bar{max-width:var(--col);margin:0 auto}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 11px;padding:0;list-style:none}
.chip{font:inherit;font-size:12.5px;color:var(--dim);background:transparent;
  border:1px solid var(--rule-2);border-radius:999px;padding:6px 13px;cursor:pointer;
  transition:background .15s ease,color .15s ease}
.chip:hover{color:var(--ink);background:#ffffff0f}

/* the composer, at the measured geometry: #303030 at a 14px radius with 8px
   of padding around a 15px/21px field */
.composer{background:var(--raised);border-radius:14px;padding:8px;
  border:1px solid var(--rule-2)}
.line{display:flex;align-items:flex-end;gap:8px;padding-left:8px}
#msg{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:inherit;
  font-size:15px;line-height:21px;padding:7px 0;resize:none}
#msg:focus{outline:none}
#msg::placeholder{color:var(--dimmer)}
#send{flex:0 0 auto;width:28px;height:28px;border-radius:8px;border:0;cursor:pointer;
  background:var(--clay);color:#fff;display:grid;place-items:center;
  transition:background .15s ease}
#send:hover{background:var(--clay-hot)}
#send:disabled{background:#ffffff1a;color:var(--dimmer);cursor:default}
#send svg{width:15px;height:15px;display:block}

.tools{display:flex;align-items:center;gap:7px;margin-top:11px;flex-wrap:wrap}
.btn{font:inherit;font-size:12px;color:var(--dim);background:transparent;
  border:1px solid var(--rule-2);border-radius:8px;padding:6px 11px;cursor:pointer;
  transition:background .15s ease,color .15s ease}
.btn:hover{color:var(--ink);background:#ffffff0f}
.btn[aria-pressed="true"]{background:var(--clay);color:#fff;border-color:var(--clay)}
.btn:disabled{opacity:.35;cursor:default}
.btn:disabled:hover{background:transparent;color:var(--dim)}
.bits{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--dimmer);
  white-space:nowrap;text-align:right}
.bits b{font-size:16px;color:var(--ink);font-weight:500}
button:focus-visible,input:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
@media (max-width:820px){ :root{--col:100%} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="mark"><b>What it almost said</b> &nbsp;· the field it chose from, one word at a time</div>
  <div class="status" id="status">loading</div>
</header>

<div id="thread"><div class="inner" id="log"></div></div>

<div id="inspect"><div class="ins">
  <h4 id="insHead"></h4>
  <div class="bars" id="insBars"></div>
</div></div>

<footer><div class="bar">
  <ul class="chips" id="chips"></ul>
  <div class="composer">
    <div class="line">
      <input id="msg" type="text" autocomplete="off" spellcheck="false"
             placeholder="Ask anything, and watch it choose.">
      <button id="send" title="Send" disabled aria-label="Send">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 13V3.5M8 3.5 3.5 8M8 3.5 12.5 8" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="tools">
    <button class="btn" id="reload" title="Fetch the latest published build">Reload</button>
    <button class="btn" id="replay" disabled>Replay</button>
    <button class="btn" id="stepMode" aria-pressed="false">Step by word</button>
    <button class="btn" id="next" disabled>Next word</button>
    <p class="bits"><b id="bits">0.0</b> bits of surprise</p>
  </div>
</div></footer>

<script src="runs.js"></script>
<script type="module">
  import { load, generate } from "./live.js";
  window.liveGenerate = generate;
</script>
<script>
/* ---------------------------------------------------------------------------
   Episode 1. The reply is built a word at a time. At each position the field
   of candidates opens below the line, and the one the model took lifts out of
   it and into the sentence.

   Timing carries meaning. A word the model was certain of appears at once,
   with no field at all; an uncertain one holds while its field is readable.
   The pace of the reply is therefore a readout of the model's hesitation.

   The data is real: SmolLM2-360M-Instruct, nucleus sampling at 0.7 for these
   replies, with the top 24 candidate logits kept at every step. Sampling
   rather than greedy on purpose, so the word taken is not always the
   favourite and "it chose" means something.
--------------------------------------------------------------------------- */

const FAN_N = 6;          /* candidates shown under every word */
const MAX_CH = 11;        /* a long candidate is clipped so it cannot shove the line apart */
const T_FAN = 70, T_RISE = 200;

const $ = id => document.getElementById(id);
const DATA = window.RUNS || null;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const pc = q => (q*100).toFixed(q < .01 ? 2 : 1) + "%";
const esc = s => s.replace(/[&<>]/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));

let seq = 0, stepMode = false, gate = null, lastRun = null, totalBits = 0;

/* true probabilities, recovered exactly from the kept logits and the recorded
   probability of the token actually taken: p_i = p * exp(l_i - l) */
const probs = st => st.cands.map(([w,l]) => [w, st.p * Math.exp(l - st.l)]);

/* ---- boot ---- */
/* The header carries two lines: what the model is, which never changes, and
   what it is currently doing, which does. Keeping them separate stops the
   load state from overwriting the provenance, and stops the page from
   claiming you can ask it anything while the weights are at 7%. */
let PROV = "";
window.onLiveStatus = (msg, bad)=>{
  const state = bad ? `<span style="color:#9B3B2E">${msg}</span>` : msg;
  $("status").innerHTML = PROV ? `${PROV}<br>${state}` : state;
  const ready = window.LIVE && window.LIVE.ready;
  $("msg").placeholder = ready
    ? "Ask it anything."
    : bad ? "Pick a question above." : "Ask it anything. It will wait for the weights.";
};

function boot(){
  if(!DATA){ $("status").innerHTML = '<span style="color:#9B3B2E">runs.js did not load</span>'; return; }
  /* the decode settings belong to whoever is answering, not to the header:
     the recorded runs used a fixed seed, live generation has none */
  PROV = `${DATA.model} · ${DATA.quant} · top ${DATA.top_k} kept`;
  /* this classic script runs before the deferred module, so window.LIVE does
     not exist yet and cannot be tested here. State the recorded truth; if a
     live provider is present it overwrites the second line a tick later. */
  $("status").innerHTML = `${PROV}<br>${DATA.decode.single} · recorded ${DATA.captured}`;
  DATA.single.forEach(r=>{
    const li = document.createElement("li"), b = document.createElement("button");
    b.className = "chip"; b.textContent = r.prompt;
    b.onclick = ()=> ask(r.prompt);
    li.appendChild(b); $("chips").appendChild(li);
  });
}
const findRun = text => {
  const n = s => s.toLowerCase().replace(/[^a-z0-9 ]/g,"").trim(), t = n(text);
  const all = [...DATA.single, ...DATA.open];
  return all.find(r => n(r.prompt) === t) || all.find(r => t.length > 8 && n(r.prompt).includes(t));
};

/* ---- turns ---- */
function addTurn(role, who){
  const w = document.createElement("div");
  w.className = "turn " + role;
  const h = document.createElement("p");
  h.className = "who"; h.textContent = who;
  w.appendChild(h);
  $("log").appendChild(w);
  return w;
}
const scroll = ()=> $("thread").scrollTop = $("thread").scrollHeight;

/* ---- one word ---- */
function buildTok(st, idx, onPick, given){
  const tok = document.createElement("span");
  tok.className = given ? "tok given" : "tok";
  if(given){
    /* 12 bits is about the point past which the model plainly had no idea.
       A floor keeps a hairline under every word the person typed, so a still
       frame still shows whose words are whose: the model's carry none. */
    tok.style.setProperty("--surprise",
      clamp(.2 + (st.bits / 12) * .8, .2, 1).toFixed(2));
  }
  tok.dataset.i = idx;

  const word = document.createElement("span");
  word.className = "word";
  word.textContent = st.tok;
  tok.appendChild(word);

  /* every word shows its field, however sure the model was. a confident word's
     alternatives are all under a percent, so there is no floor; opacity carries
     how little they were worth instead of hiding them. */
  const P = probs(st);
  const field = P.slice(0, FAN_N);
  /* The word taken must be in the field, even when it was a long shot. But a
     word the PERSON typed is not forced in: the model ranked "grass" 250th
     here, and dropping it into the sixth slot would invent a rank it never
     had. If it is absent, the model simply did not see that word coming. */
  let wi = field.findIndex(([w]) => w === st.tok);
  if(wi < 0 && !given){ field.pop(); field.push([st.tok, st.p]); wi = field.length - 1; }
  const clip = w => w.length > MAX_CH ? w.slice(0, MAX_CH - 1) + "\u2026" : w;
  /* the sentence spaces itself out so each field has somewhere to sit */
  const widest = Math.max(st.tok.length, ...field.map(([w]) => clip(w).length));
  tok.style.setProperty("--pad", ((widest - st.tok.length) / 2).toFixed(2) + "ch");

  const fan = document.createElement("span");
  fan.className = "fan";
  field.forEach(([w,q], i)=>{
    const el = document.createElement("i");
    el.textContent = clip(w);
    /* floor raised from .06: white at 6% is invisible on #191919, where the
       old parchment theme still showed it. opacity carries how little the
       candidate was worth, so it has to stay visible to carry anything. */
    el.style.setProperty("--o", (.13 + Math.sqrt(q) * .72).toFixed(3));
    if(i === wi) el.classList.add("win");
    fan.appendChild(el);
  });
  tok.appendChild(fan);
  return { tok, fan, word, wi };
}

/* ---- play a reply ---- */
/* One lane, opened once and written into from both directions. */
function openStream(turn){
  turn.classList.remove("waiting");   /* the mark stops breathing */
  const p = document.createElement("p");
  p.className = "reply";
  turn.appendChild(p);
  const caret = document.createElement("span");
  caret.className = "caret";
  p.appendChild(caret);
  return { p, caret };
}

function restFan(fan, wi){
  fan.classList.remove("in","out","sink");
  fan.classList.add("rest");
  [...fan.children].forEach((el,k)=>{ if(k !== wi && k < 4) el.classList.add("keep"); });
}

/* The words the person gave. The field under each is what the model expected
   there instead, and it sinks away: what they typed overrules it. Where the
   model had already guessed the word, it stays lit in the field as it sinks. */
async function playGiven(ctx, given, my){
  for(let i = 0; i < given.length; i++){
    if(my !== seq) return false;
    const st = given[i];
    const { tok, fan, wi } = buildTok(st, i, null, true);
    ctx.p.insertBefore(tok, ctx.caret);
    tok.classList.add("set");          /* a typed word arrives already settled */
    attachInspect(tok, st);

    fan.classList.add("in");
    await sleep(T_FAN);
    if(my !== seq) return false;
    /* shorter than the reply's dwell: these are not decisions, they are
       already facts, and the beat only has to be long enough to read */
    await sleep(stepMode ? 170 : clamp(st.bits * 52, 70, 330));
    if(my !== seq) return false;

    fan.classList.add("sink");
    await sleep(190);
    if(my !== seq) return false;
    restFan(fan, wi);
    scroll();
  }
  return true;
}

/* The words the model chose. Same field, opposite motion: nothing overrules
   it here, so the one it took rises out of the field and into the line. */
async function playSteps(ctx, steps, my){
  for(let i = 0; i < steps.length; i++){
    if(my !== seq) return false;
    const st = steps[i];
    const { tok, fan, wi } = buildTok(st, i, null);
    ctx.p.insertBefore(tok, ctx.caret);
    totalBits += st.bits;
    $("bits").textContent = totalBits.toFixed(1);
    attachInspect(tok, st);

    if(stepMode){ $("next").disabled = false; await waitGate(); $("next").disabled = true; }
    if(my !== seq) return false;

    fan.classList.add("in");
    await sleep(T_FAN);
    if(my !== seq) return false;

    /* held open in proportion to the doubt: a word the model was sure of barely
       pauses, an uncertain one stays long enough to read its field */
    await sleep(stepMode ? 240 : clamp(st.bits * 170, 0, 700));
    if(my !== seq) return false;

    const win = fan.children[wi];
    win.style.setProperty("--dy", `-${win.offsetTop}px`);
    win.classList.add("rise");
    fan.classList.add("out");
    await sleep(T_RISE - 60);
    if(my !== seq) return false;
    tok.classList.add("set");
    await sleep(60);

    restFan(fan, wi);
    win.classList.remove("rise");
    scroll();
  }
  return true;
}

function closeStream(ctx, my){
  if(my !== seq) return;
  ctx.caret.remove();
  ctx.p.classList.add("done");
  $("replay").disabled = false;
  $("next").disabled = true;
  scroll();
}

/* the bubble breaks apart and its words rejoin the sequence */
async function dissolve(userTurn){
  if(!userTurn) return;
  userTurn.style.maxHeight = userTurn.offsetHeight + "px";
  await sleep(20);
  userTurn.classList.add("gone");
  await sleep(430);
  userTurn.remove();
}

async function play(run, turn, userTurn){
  const my = ++seq;
  const ctx = openStream(turn);
  totalBits = 0;
  $("replay").disabled = true;

  if(run.given && run.given.length){
    /* The lane opens with the person's own words, so the model's name cannot
       sit over all of it. The label narrates instead: reading, then writing.
       It is the same pass either way, which is the whole point. */
    const who = turn.querySelector(".who");
    const writing = who.textContent;
    who.textContent = "reading your message";
    await sleep(520);                 /* the beat, before the surface opens */
    if(my !== seq) return;
    await dissolve(userTurn);
    if(my !== seq) return;
    if(!await playGiven(ctx, run.given, my)) return;
    who.textContent = writing;
  }
  if(!await playSteps(ctx, run.steps, my)) return;
  closeStream(ctx, my);
}

function waitGate(){ return new Promise(r => { gate = r; }); }

function attachInspect(tok, st){
  tok.onclick = e=>{
    if(!tok.classList.contains("set")) return;
    e.stopPropagation();
    document.querySelectorAll(".tok.sel").forEach(x=>x.classList.remove("sel"));
    tok.classList.add("sel");
    const P = probs(st).slice().sort((a,b)=>b[1]-a[1]), max = P[0][1];
    $("insHead").innerHTML =
      `it took <b>${esc(st.tok.trim() || "␣")}</b> at ${pc(st.p)}, ` +
      `the model's ${ord(st.rank)} choice · ${st.bits.toFixed(1)} bits of surprise · ` +
      `${P.length} of 49,152 candidates kept`;
    $("insBars").innerHTML = P.map(([w,q])=>
      `<span class="t${w === st.tok ? " is" : ""}">${esc(w.replace(/ /g,"·")) || "␣"}</span>` +
      `<span class="track"><i style="width:${(q/max*100).toFixed(1)}%"></i></span>` +
      `<span class="p">${pc(q)}</span>`).join("");
    $("inspect").classList.add("on");
  };
}
const ord = n => n + (["th","st","nd","rd"][n % 10 > 3 || (n % 100 - n % 10) === 10 ? 0 : n % 10]);

/* ---- input ---- */

/* a quiet line inside a turn, for waiting and for failure */
function note(turn, text){
  const p = Object.assign(document.createElement("p"),
    { className:"said", textContent:text });
  p.style.color = "var(--dim)";
  turn.appendChild(p); scroll(); return p;
}

async function ask(text){
  const run = DATA ? findRun(text) : null;
  const userTurn = addTurn("user", "you");
  userTurn.appendChild(
    Object.assign(document.createElement("p"), { className:"said", textContent:text }));

  /* a recorded question plays straight from the capture, which is instant */
  if(run){
    lastRun = run;
    play(run, addTurn("bot", DATA.model), userTurn);
    scroll(); return;
  }

  /* anything else is generated here, in this tab. three states, and the
     difference between them matters: a question typed during the download
     used to be turned away as though the model had failed. now it waits. */
  const L = window.LIVE;
  const turn = addTurn("bot", L && L.ready ? "thinking\u2026" : "waiting for the weights");
  turn.classList.add("waiting");
  scroll();

  if(!L){
    turn.querySelector(".who").textContent = DATA.model;
    note(turn, "No live model on this page, so only the recorded questions above " +
               "work here. A published artifact blocks the network the weights " +
               "arrive through. The hosted copy does not.");
    return;
  }

  if(!L.ready){
    const p = note(turn, "");
    const tick = setInterval(()=>{
      if(L.phase !== "loading") return;
      p.textContent = `Downloading the model, ${L.pct}% of ${L.file}. About 300MB, `
        + `cached after the first visit. Your question runs the moment it lands.`;
    }, 150);
    const ok = await L.whenReady;
    clearInterval(tick);
    if(!ok){
      turn.querySelector(".who").textContent = "could not load";
      p.textContent = (L.error || "the model would not load") +
        ". The recorded questions above still work.";
      return;
    }
    p.remove();
    turn.querySelector(".who").textContent = "thinking\u2026";
  }

  try{
    /* one forward pass per word, so the reply takes real time. the count is
       the only honest progress indicator: there is no way to know how many
       words are coming until the model emits its end-of-turn marker. */
    const who = turn.querySelector(".who");
    let given = null;
    const steps = await window.liveGenerate(text, undefined,
      (st, all)=>{
        who.textContent = `thinking\u2026 ${all.length} words, `
          + `${all.reduce((a,b)=>a+b.bits,0).toFixed(1)} bits`;
      },
      g => { given = g; });        /* arrives as soon as prefill is done */
    if(!steps.length){ note(turn, "the model stopped before saying anything"); return; }
    turn.querySelector(".who").textContent = `${DATA.model} \u00b7 live \u00b7 ${L.device}`;
    lastRun = { prompt:text, given, steps };
    play(lastRun, turn, userTurn);
  }catch(e){
    turn.querySelector(".who").textContent = "failed";
    note(turn, "generation failed: " + e.message);
  }
}

function submit(){
  const v = $("msg").value.trim();
  if(!v) return;
  $("msg").value = ""; $("send").disabled = true; ask(v);
}
$("msg").addEventListener("keydown", e=>{ if(e.key === "Enter") submit(); });
$("msg").addEventListener("input", ()=>{ $("send").disabled = !$("msg").value.trim(); });
$("send").onclick = submit;
/* saves hunting for the browser reload after a republish */
$("reload").onclick = ()=> location.reload();
$("replay").onclick = ()=>{
  if(!lastRun) return;
  $("log").innerHTML = ""; $("inspect").classList.remove("on");
  ask(lastRun.prompt);
};
$("stepMode").onclick = ()=>{
  stepMode = !stepMode;
  $("stepMode").setAttribute("aria-pressed", stepMode);
  if(!stepMode && gate){ const g = gate; gate = null; g(); }
};
$("next").onclick = ()=>{ if(gate){ const g = gate; gate = null; g(); } };
addEventListener("keydown", e=>{
  if(e.key === "ArrowRight" && gate){ e.preventDefault(); const g = gate; gate = null; g(); }
});
$("thread").addEventListener("click", ()=> $("inspect").classList.remove("on"));

boot();
</script>
