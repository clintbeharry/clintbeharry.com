<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Into the network</title>
<meta name="description" content="Ask a question and watch a language model answer it, running in your own browser.">
<link rel="icon" href="../favicon.svg">
<style>
/* ---------------------------------------------------------------------------
   A chat thread, and nothing else. The machinery shows up where a chat
   interface already puts the model's thinking, so it needs no introducing.
--------------------------------------------------------------------------- */
:root{
  --page:#191919; --raised:#303030;
  --ink:#ffffffed; --dim:#ffffff91; --dimmer:#ffffff66;
  --rule:#ffffff0a; --rule-2:#ffffff14;
  --clay:#d97757; --clay-hot:#c6613f;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --col:760px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--page)}
body{color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}

#thread{flex:1 1 auto;overflow-y:auto;padding:32px 20px 8px}
#thread::-webkit-scrollbar{width:10px}
#thread::-webkit-scrollbar-thumb{background:#ffffff1f;border-radius:5px}
.inner{max-width:var(--col);margin:0 auto}

/* the asker on the right in a bubble, the model on the left at full width */
.turn{margin:0 0 26px}
.turn.user{display:flex;justify-content:flex-end}
.said{background:var(--raised);border-radius:16px;padding:9px 15px;max-width:76%;
  line-height:1.5;white-space:pre-wrap;word-break:break-word}
.q{background:var(--raised);border-radius:16px;padding:9px 15px;max-width:76%;
  line-height:1.5;opacity:0;transition:opacity .45s ease}
.q b{font-weight:400}

.turn.bot .who{display:flex;align-items:center;gap:10px;margin:0 0 13px;
  font-family:var(--mono);font-size:11.5px;min-height:14px}

/* The thinking mark. Three dots is what every chat uses to say it is working,
   and it belongs to none of them. Deliberately not anyone's logo. */
.think{display:inline-flex;gap:4px;align-items:center;flex:0 0 auto;
  transition:opacity .55s ease}
.think b{width:5px;height:5px;border-radius:50%;background:var(--clay);
  animation:thinkpulse 1.35s ease-in-out infinite}
.think b:nth-child(2){animation-delay:.17s}
.think b:nth-child(3){animation-delay:.34s}
@keyframes thinkpulse{0%,72%,100%{opacity:.26;transform:scale(.78)}
                      34%{opacity:1;transform:scale(1)}}
/* once there is a cursor, the page is answering rather than working out what
   to answer, so the mark hands over to it */
.turn.bot.answering .think{opacity:0}

/* What the machine is doing, with a pulse travelling along it so the line
   itself reads as work in progress. */
#hud{letter-spacing:.02em;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;
  background:linear-gradient(90deg,
    var(--dimmer) 0%, var(--dimmer) 38%, #ffffff 50%, var(--dimmer) 62%, var(--dimmer) 100%);
  background-size:260% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:sweep 2.8s linear infinite;transition:opacity .5s ease}
@keyframes sweep{0%{background-position:130% 0}100%{background-position:-30% 0}}
.turn.bot.spoken #hud{opacity:0}
@media (prefers-reduced-motion:reduce){
  #hud{animation:none;background:none;color:var(--dimmer)}
}
.turn.bot .answer{margin:14px 0 0;white-space:pre-wrap;word-break:break-word}

/* The visualisation sits where a chat puts its thinking, and sits ON the
   thread rather than inside a frame. A border and a darker fill made it read
   as a video embedded in the page, which is the opposite of the claim: this
   is the message being formed, not a recording of one. */
.stage{position:relative;overflow:hidden;background:var(--page);
  transition:height .6s cubic-bezier(.4,0,.2,1),opacity .45s ease}
.stage canvas{display:block;width:100%;height:100%;position:absolute;inset:0}
.stage .pad{display:block;width:100%}
#ov{pointer-events:none}
/* The caption used to be pinned inside the stage. It lives in the message's
   own line now, beside the thinking mark, so it is laid out rather than
   placed: absolute positioning left it stuck to the corner of the window. */
.hud{font-family:var(--mono);font-size:11.5px;pointer-events:none;
  letter-spacing:.02em;min-width:0}
/* parked offscreen until a turn claims it, at a real size so the canvas
   does not have to be resized from zero when it lands */
#park{position:fixed;left:-10000px;top:0;width:1000px;height:560px}

/* ---- the reply, written into the thread ----
   Each word reserves room under itself for the field it was chosen from, so
   the line opens a band deep enough to hold one. The word keeps a tight line
   box of its own, so the field hangs under the glyph and not under the whole
   opened line. */
.reply{--row:18px;--gap:12px;--band:calc(var(--gap) + 7.4*var(--row));
  line-height:var(--band);margin:calc((1.6em - var(--band))/2) 0 0;
  white-space:pre-wrap;word-break:break-word;color:var(--ink)}
/* Once it has been read, the band closes to ordinary prose and the fields go
   with it. They are absolutely positioned under their word, so a closed band
   leaves them sitting on the line below: the finished answer has to be an
   answer, not an answer with the rejected words written through it. */
.reply.done{--band:1.65em;
  transition:line-height .6s cubic-bezier(.3,0,.2,1),margin-top .6s cubic-bezier(.3,0,.2,1)}
/* Faded out is not gone: an invisible field is still part of the text, so
   selecting the finished answer copied every rejected word along with it.
   Hidden after the fade, it leaves the sentence by itself. */
.reply.done .fan{opacity:0;visibility:hidden;
  transition:opacity .4s ease,visibility 0s linear .4s}
.reply.done .fan i{opacity:0;transition:opacity .4s ease}
/* and the room each word was holding for its field is given back, so what is
   left reads as a sentence rather than as a timing diagram */
.reply.done .tok{padding-left:0;padding-right:0;
  transition:padding .5s cubic-bezier(.3,0,.2,1)}
.tok{position:relative;display:inline-block;white-space:pre;vertical-align:baseline;
  line-height:1.3;text-align:center;padding-left:var(--pad,0);padding-right:var(--pad,0)}
.tok .word{display:inline-block;line-height:1.3;opacity:0;
  transition:opacity .16s ease,color .3s ease}
.tok.set .word{opacity:1}
.tok.set .word{color:var(--ink)}

/* The lines back to the word. Each candidate was reached from the word above
   it, and without them the field reads as a list that happens to be sitting
   there rather than as a set of things one word led to. */
.wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;
  opacity:0;transition:opacity .26s ease}
.wires.in{opacity:1}

/* the field hangs below the word it belongs to */
.fan{position:absolute;left:50%;transform:translateX(-50%);
  top:calc(100% + var(--gap));display:flex;flex-direction:column;align-items:center;
  white-space:pre;pointer-events:none}
.fan i{font-style:normal;display:flex;gap:6px;align-items:baseline;
  height:var(--row);line-height:var(--row);font-size:13px;color:var(--dim);
  opacity:0;transition:opacity .24s ease,transform .32s cubic-bezier(.3,0,.2,1)}
.fan i s{font-family:var(--mono);font-size:10px;color:var(--dimmer);
  text-decoration:none;font-variant-numeric:tabular-nums}
.fan.in i{opacity:var(--o,.35)}
.fan i.win{color:var(--clay);font-weight:500}
.fan i.win s{color:var(--clay);opacity:.75}
/* the one it took lifts out of the field and into the sentence */
.fan i.rise{transform:translateY(var(--dy));opacity:1;
  transition:transform .34s cubic-bezier(.4,0,.2,1),opacity .3s ease}
.fan.out i:not(.rise){opacity:0}
.fan.rest i{opacity:0}
.fan.rest i.keep{opacity:calc(var(--o,.35) * .26);transition:opacity .7s ease}

/* the share it was taken at, rising away above the line */
.lift{position:absolute;left:50%;top:-2px;transform:translateX(-50%);
  font-family:var(--mono);font-size:10.5px;color:var(--clay);pointer-events:none;
  opacity:0;white-space:pre}
.lift.go{opacity:1;animation:liftaway 2.6s cubic-bezier(.25,.6,.3,1) forwards}
@keyframes liftaway{
  0%{opacity:0;transform:translate(-50%,4px)}
  14%{opacity:.95;transform:translate(-50%,-6px)}
  100%{opacity:0;transform:translate(-50%,-40px)}
}
.caret{display:inline-block;width:2px;height:1.05em;vertical-align:-.16em;
  background:var(--clay);border-radius:1px;animation:blink 1.15s steps(1,end) infinite}
@keyframes blink{0%,45%{opacity:1}46%,100%{opacity:0}}

/* message actions, the way a chat shows copy and retry */
.acts{display:flex;gap:4px;margin:9px 0 0}
.acts button{appearance:none;background:none;border:0;cursor:pointer;
  color:var(--dimmer);font:inherit;font-size:12px;padding:4px 8px;border-radius:7px}
.acts button:hover:not(:disabled){color:var(--ink);background:#ffffff0f}
.acts button:disabled{opacity:.35;cursor:default}

/* the one thing the page does ask, before spending someone's bandwidth */
.gate{border:1px solid var(--rule-2);border-radius:12px;padding:14px 16px;
  background:#1f1f1f;max-width:62ch}
.gate p{margin:0 0 12px;color:var(--dim);font-size:14px}
.gate b{color:var(--ink);font-weight:600}
.gate .row{display:flex;gap:8px;flex-wrap:wrap}
.gate button{appearance:none;font:inherit;font-size:13px;padding:7px 14px;
  border-radius:9px;cursor:pointer;border:1px solid var(--rule-2);
  background:#272727;color:var(--dim)}
.gate button:hover{color:var(--ink);border-color:#ffffff2e}
.gate button.go{background:var(--clay);border-color:var(--clay);color:#1a1008;font-weight:600}
.gate button.go:hover{background:var(--clay-hot)}

footer{flex:0 0 auto;padding:6px 20px 20px;background:var(--page)}
.bar{max-width:var(--col);margin:0 auto}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 11px;padding:0;list-style:none}
.chip{font:inherit;font-size:12.5px;color:var(--dim);background:transparent;
  border:1px solid var(--rule-2);border-radius:999px;padding:6px 13px;cursor:pointer;
  transition:background .15s ease,color .15s ease}
.chip:hover{color:var(--ink);background:#ffffff0f}
.composer{background:var(--raised);border-radius:16px;padding:8px;
  border:1px solid var(--rule-2)}
.line{display:flex;align-items:flex-end;gap:8px;padding-left:8px}
#msg{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:inherit;
  font-size:15px;line-height:21px;padding:7px 0}
#msg:focus{outline:none}
#msg::placeholder{color:var(--dimmer)}
#send{flex:0 0 auto;width:28px;height:28px;border-radius:8px;border:0;cursor:pointer;
  background:var(--clay);color:#fff;display:grid;place-items:center;
  transition:background .15s ease}
#send:hover:not(:disabled){background:var(--clay-hot)}
#send:disabled{background:#ffffff1a;color:var(--dimmer);cursor:default}
#send svg{width:15px;height:15px;display:block}
button:focus-visible,input:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
@media (max-width:640px){
  #thread{padding:20px 14px 6px} footer{padding:6px 14px 16px}
  .said,.q{max-width:88%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<main id="thread"><div class="inner" id="log"></div></main>

<footer><div class="bar">
  <ul class="chips" id="chips"></ul>
  <div class="composer">
    <div class="line">
      <input id="msg" type="text" autocomplete="off" spellcheck="false"
             placeholder="Ask anything">
      <button id="send" title="Ask" disabled aria-label="Ask">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 13V3.5M8 3.5 3.5 8M8 3.5 12.5 8" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
</div></footer>

<!-- claimed by whichever turn is current -->
<div id="park">
  <div class="q" id="q"></div>
  <div class="stage" id="stage">
    <img class="pad" alt="" aria-hidden="true"
         src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='1000' height='540'%3E%3C/svg%3E">
    <canvas id="gl"></canvas>
    <canvas id="ov"></canvas>
    <div class="hud" id="hud"></div>
  </div>
  <span id="step"></span><span id="note"></span><button id="pause"></button>
</div>

<script>

</script>

</body>
</html>
