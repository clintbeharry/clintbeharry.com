<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Into the network</title>
<meta name="description" content="Ask a question and watch a language model answer it, running in your own browser.">
<link rel="icon" href="../favicon.svg">
<style>
/* ---------------------------------------------------------------------------
   A chat thread, and nothing else. The machinery shows up where a chat
   interface already puts the model's thinking, so it needs no introducing.
--------------------------------------------------------------------------- */
:root{
  --page:#191919; --raised:#303030;
  --ink:#ffffffed; --dim:#ffffff91; --dimmer:#ffffff66;
  --rule:#ffffff0a; --rule-2:#ffffff14;
  --clay:#d97757; --clay-hot:#c6613f;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --col:760px;
  color-scheme:dark;
}
*{box-sizing:border-box}
/* 100% of what, on a phone, changes as the browser chrome slides away, which
   is how the page ended up taller than the window and scrolling as a whole.
   dvh is the window as it actually is at that moment. */
html,body{height:100%;margin:0;background:var(--page);overflow:hidden}
body{height:100dvh}
body{color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}

/* A field opening to the right of the last word on a line reaches past the
   column, and absolutely positioned things still count toward the page width.
   Clipped here, so a fan near the edge is cut rather than scrolling the site. */
#thread{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:32px 20px 8px}
#thread::-webkit-scrollbar{width:10px}
#thread::-webkit-scrollbar-thumb{background:#ffffff1f;border-radius:5px}
.inner{max-width:var(--col);margin:0 auto}

/* the asker on the right in a bubble, the model on the left at full width */
.turn{margin:0 0 26px}
.turn.user{display:flex;justify-content:flex-end}
.said{background:var(--raised);border-radius:16px;padding:9px 15px;max-width:76%;
  line-height:1.5;white-space:pre-wrap;word-break:break-word}
.q{background:var(--raised);border-radius:16px;padding:9px 15px;max-width:76%;
  line-height:1.5;opacity:0;transition:opacity .45s ease}
.q b{font-weight:400}

.turn.bot .who{display:flex;align-items:flex-start;gap:10px;margin:0 0 13px;
  font-family:var(--mono);font-size:11.5px;min-height:14px}

/* The thinking mark. Three dots is what every chat uses to say it is working,
   and it belongs to none of them. Deliberately not anyone's logo. */
.think{display:inline-flex;gap:4px;align-items:center;flex:0 0 auto;margin-top:4px;
  transition:opacity .55s ease}
.think b{width:5px;height:5px;border-radius:50%;background:var(--clay);
  animation:thinkpulse 1.35s ease-in-out infinite}
.think b:nth-child(2){animation-delay:.17s}
.think b:nth-child(3){animation-delay:.34s}
@keyframes thinkpulse{0%,72%,100%{opacity:.26;transform:scale(.78)}
                      34%{opacity:1;transform:scale(1)}}
/* once there is a cursor, the page is answering rather than working out what
   to answer, so the mark hands over to it */
.turn.bot.answering .think{opacity:0}

/* What the machine is doing, with a pulse travelling along it so the line
   itself reads as work in progress. */
/* it wraps rather than truncating: on a phone the line was being cut off
   mid-sentence, which is a poor way to explain anything */
#hud{letter-spacing:.02em;line-height:1.35;
  background:linear-gradient(90deg,
    var(--dimmer) 0%, var(--dimmer) 38%, #ffffff 50%, var(--dimmer) 62%, var(--dimmer) 100%);
  background-size:260% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:sweep 2.8s linear infinite;transition:opacity .5s ease}
@keyframes sweep{0%{background-position:130% 0}100%{background-position:-30% 0}}
.turn.bot.spoken #hud{opacity:0}
@media (prefers-reduced-motion:reduce){
  #hud{animation:none;background:none;color:var(--dimmer)}
}
.turn.bot .answer{margin:14px 0 0;white-space:pre-wrap;word-break:break-word}

/* The visualisation sits where a chat puts its thinking, and sits ON the
   thread rather than inside a frame. A border and a darker fill made it read
   as a video embedded in the page, which is the opposite of the claim: this
   is the message being formed, not a recording of one. */
/* The stage takes its shape from the room it is in. A fixed wide slab leaves
   a phone showing a short strip with the whole sequence shrunk inside it,
   when what a phone actually has is height. */
.stage{position:relative;overflow:hidden;background:var(--page);
  width:100%;aspect-ratio:1000/540;
  transition:height .6s cubic-bezier(.4,0,.2,1),opacity .45s ease}
.stage canvas{display:block;width:100%;height:100%;position:absolute;inset:0}

#ov{pointer-events:none}
/* The caption used to be pinned inside the stage. It lives in the message's
   own line now, beside the thinking mark, so it is laid out rather than
   placed: absolute positioning left it stuck to the corner of the window. */
.hud{font-family:var(--mono);font-size:11.5px;pointer-events:none;
  letter-spacing:.02em;min-width:0}
/* parked offscreen until a turn claims it, at a real size so the canvas
   does not have to be resized from zero when it lands */
#park{position:fixed;left:-10000px;top:0;width:1000px;height:560px}

/* ---- the reply, written into the thread ----
   Each word reserves room under itself for the field it was chosen from. The
   band is deliberately shallower than the field is tall when it opens: the
   field opens out to the RIGHT of the word, where there is room, and only
   settles underneath once the word has been taken. The drop from open field
   to finished sentence is a small one that way. */
.reply{--row:11px;          /* spacing once the field has settled */
  --gap:4px;              /* and how far under the word it settles */
  /* The band has to clear the field while it is OPEN, which hangs further
     down than the settled rows do. Tying it to the settled spacing meant the
     two could not be tuned apart: pulling the alternatives up under their
     word also pulled the next line up into the open field. */
  --band:88px;
  line-height:var(--band);margin:calc((1.6em - var(--band))/2) 0 0;
  white-space:pre-wrap;word-break:break-word;color:var(--ink)}
/* finished, the words give back the room they were holding */
.reply.done .tok{--mag:0;--spread:0}
/* A touch airier than prose needs, because the finished text is also the
   thing you explore: the fields hang below their words, and a band with no
   slack in it meant every field landed squarely on the next line. Paid once,
   in the settled layout, rather than by moving the paragraph when the
   pointer arrives. */
.reply.done{--band:2.05em;
  transition:line-height .55s cubic-bezier(.3,0,.2,1),margin-top .55s cubic-bezier(.3,0,.2,1)}
/* Exploring does NOT reopen the band, and does not give the words back their
   padding either. Both of those relaid the paragraph out under the pointer:
   the line you were reading dropped 60px, the word you were aiming at slid
   sideways, and every frame of that motion changed what you were pointing at.
   A magnifier that moves its subject is not a magnifier. The finished text
   now holds absolutely still, and everything inspection does is drawn on top
   of it: scale is a transform, which takes no space, and a field is already
   absolutely positioned, so it has never taken any. */
.reply.done .tok{
  /* The bulge, and the room made for it. Both are transforms, so the line is
     not laid out again and the word under the pointer stays exactly where the
     pointer found it; the neighbours slide a few pixels to give back the
     space the growth takes, which is the part that makes it read as a lens
     rather than as one word quietly getting bigger. */
  transform:translateX(var(--push,0px)) scale(calc(1 + .13 * var(--lens,0)));
  z-index:calc(1 + var(--lens,0) * 10)}
/* the sentence recedes so the field can be read over it. Driven by its own
   variable rather than by --lens, so letting go eases back instead of
   snapping when the inspect class comes off. */
.reply.done .tok .word{opacity:calc(1 - var(--hide,0))}
.reply.done.inspect .tok.at .word{color:var(--clay)}
.reply.done .tok{cursor:default}
.reply.done.ready .tok{cursor:pointer}

.tok{position:relative;display:inline-block;white-space:pre;vertical-align:baseline;
  line-height:1.3;text-align:center;
  /* Two falloffs, not one. --spread is the room a word takes, --mag is how
     strongly its field shows. Tied together, a neighbour at half strength
     showed a full-width field in half the room and sat on top of its
     neighbour's. Room has to open faster than the field appears. */
  padding-left:calc(var(--pad,0ch) * var(--spread,1));
  padding-right:calc(var(--pad,0ch) * var(--spread,1));
  transform-origin:50% 50%;
  transition:padding .26s cubic-bezier(.3,0,.2,1),
             transform .2s cubic-bezier(.3,0,.2,1)}
.tok .word{display:inline-block;line-height:1.3;opacity:0;
  transition:opacity .2s ease,color .3s ease}
.tok.set .word{opacity:1;color:var(--ink)}

/* The lines back to the word. Without them the field reads as a list that
   happens to be sitting there rather than things one word led to. */
.wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;
  opacity:0;transition:opacity .26s ease}
.wires.in{opacity:1}

/* The field. Anchored at the word's baseline; every row places itself, so it
   can open to the right and settle underneath without relayout. */
.fan{position:absolute;left:50%;top:100%;width:0;height:0;pointer-events:none}
.fan i{position:absolute;left:0;top:0;font-style:normal;
  display:flex;gap:5px;align-items:baseline;white-space:pre;
  height:var(--row);line-height:var(--row);font-size:12.5px;color:var(--dim);
  /* --cx is the anchor: open, a row hangs to the RIGHT of the word from its
     centre; settled, it centres under it. Centre-anchored throughout, a row
     wider than its word reached back over the word it came from. */
  transform:translate(calc(var(--cx,-50%) + var(--x,0px)), var(--y,0px));
  opacity:0;
  transition:transform .42s cubic-bezier(.3,0,.2,1),opacity .26s ease}
.fan i s{font-family:var(--mono);font-size:9.5px;color:var(--dimmer);
  text-decoration:none;font-variant-numeric:tabular-nums}
.fan.in i{opacity:var(--o,.35)}
.fan i.win{color:var(--clay);font-weight:500}
.fan i.win s{color:var(--clay);opacity:.75}
.fan.out i:not(.win){opacity:0}
.fan.rest i{opacity:0}
/* What a word nearly was is the point of the piece, so the traces it leaves
   are worth reading rather than merely sensing. */
.fan.rest i.keep{opacity:calc(var(--o,.35) * .72);transition:opacity .7s ease}

/* Faded out is not gone: an invisible field is still part of the text, so
   selecting the finished answer copied every rejected word with it. */
.reply.done .fan{opacity:0;visibility:hidden;
  transition:opacity .4s ease,visibility 0s linear .4s}
.reply.done.inspect .fan{opacity:var(--mag,0);visibility:visible;
  transition:opacity .26s ease}
.reply.done.inspect .fan i{
  /* Read over the paragraph now rather than in a gap opened for it, so each
     row carries its own piece of background with it, a shade above the page
     so the field sits plainly on top of the sentence. Opacity still ranks the
     candidates, off a much higher floor: during the animation a 0.8% row is
     a glimpse, but here it is something somebody has stopped to read. */
  opacity:calc(.52 + var(--o,.35) * .48);
  background:#1d1d1d;box-shadow:0 0 0 5px #1d1d1d;border-radius:3px}
.reply.done.inspect .fan i.win{opacity:1}
/* four, not six. The tail of a field is a row of 0.01%s, and six rows reached
   two lines down the paragraph. */
.reply.done.inspect .fan i:nth-child(n+5){opacity:0}

/* the share it was taken at, rising away above the line */
.lift{position:absolute;left:50%;top:-2px;transform:translateX(-50%);
  font-family:var(--mono);font-size:10px;color:var(--clay);pointer-events:none;
  opacity:0;white-space:pre}
.lift.go{opacity:1;animation:liftaway 2.4s cubic-bezier(.25,.6,.3,1) forwards}
@keyframes liftaway{
  0%{opacity:0;transform:translate(-50%,4px)}
  14%{opacity:.95;transform:translate(-50%,-6px)}
  100%{opacity:0;transform:translate(-50%,-34px)}
}
.caret{display:inline-block;width:2px;height:1.05em;vertical-align:-.16em;
  background:var(--clay);border-radius:1px;animation:blink 1.15s steps(1,end) infinite}
@keyframes blink{0%,45%{opacity:1}46%,100%{opacity:0}}

/* message actions, the way a chat shows copy and retry */
.acts{display:flex;gap:4px;margin:9px 0 0}
.acts button{appearance:none;background:none;border:0;cursor:pointer;
  color:var(--dimmer);font:inherit;font-size:12px;padding:4px 8px;border-radius:7px}
.acts button:hover:not(:disabled){color:var(--ink);background:#ffffff0f}
.acts button:disabled{opacity:.35;cursor:default}

/* the one thing the page does ask, before spending someone's bandwidth */
.gate{border:1px solid var(--rule-2);border-radius:12px;padding:14px 16px;
  background:#1f1f1f;max-width:62ch}
.gate p{margin:0 0 12px;color:var(--dim);font-size:14px}
.gate b{color:var(--ink);font-weight:600}
.gate .row{display:flex;gap:8px;flex-wrap:wrap}
.gate button{appearance:none;font:inherit;font-size:13px;padding:7px 14px;
  border-radius:9px;cursor:pointer;border:1px solid var(--rule-2);
  background:#272727;color:var(--dim)}
.gate button:hover{color:var(--ink);border-color:#ffffff2e}
.gate button.go{background:var(--clay);border-color:var(--clay);color:#1a1008;font-weight:600}
.gate button.go:hover{background:var(--clay-hot)}

footer{flex:0 0 auto;padding:6px 20px 20px;background:var(--page)}
.bar{max-width:var(--col);margin:0 auto}
/* Out of the way until asked for. They are a prompt, not furniture, and on a
   phone they were taking up most of the screen before anything had happened. */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:0;padding:0;list-style:none;
  max-height:0;opacity:0;overflow:hidden;
  transition:max-height .32s cubic-bezier(.3,0,.2,1),opacity .24s ease,
             margin .32s cubic-bezier(.3,0,.2,1)}
.bar.open .chips{max-height:40vh;opacity:1;margin:0 0 11px}
.chip{font:inherit;font-size:12.5px;color:var(--dim);background:transparent;
  border:1px solid var(--rule-2);border-radius:999px;padding:6px 13px;cursor:pointer;
  transition:background .15s ease,color .15s ease}
.chip:hover{color:var(--ink);background:#ffffff0f}
.composer{background:var(--raised);border-radius:16px;padding:8px;
  border:1px solid var(--rule-2)}
/* The box holds one line, so the button belongs on that line's middle.
   flex-end hung it off the input's baseline, and the input is taller than the
   button by its own padding, which showed up as a gap above the arrow. */
.line{display:flex;align-items:center;gap:8px;padding-left:8px}
#msg{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:inherit;
  font-size:15px;line-height:21px;padding:7px 0}
#msg:focus{outline:none}
#msg::placeholder{color:var(--dimmer)}
#send{flex:0 0 auto;width:28px;height:28px;border-radius:8px;border:0;cursor:pointer;
  background:var(--clay);color:#fff;display:grid;place-items:center;
  transition:background .15s ease}
#send:hover:not(:disabled){background:var(--clay-hot)}
#send:disabled{background:#ffffff1a;color:var(--dimmer);cursor:default}
#send svg{width:15px;height:15px;display:block}
button:focus-visible,input:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
@media (max-width:700px){
  #thread{padding:20px 14px 6px} footer{padding:6px 14px 16px}
  .said,.q{max-width:88%}
  /* upright, because that is the shape of the space a phone has */
  .stage{aspect-ratio:3/4}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<main id="thread"><div class="inner" id="log"></div></main>

<footer><div class="bar">
  <ul class="chips" id="chips"></ul>
  <div class="composer">
    <div class="line">
      <input id="msg" type="text" autocomplete="off" spellcheck="false"
             placeholder="Ask anything">
      <button id="send" title="Ask" disabled aria-label="Ask">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 13V3.5M8 3.5 3.5 8M8 3.5 12.5 8" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
</div></footer>

<!-- claimed by whichever turn is current -->
<div id="park">
  <div class="q" id="q"></div>
  <div class="stage" id="stage">
    <canvas id="gl"></canvas>
    <canvas id="ov"></canvas>
    <div class="hud" id="hud"></div>
  </div>
  <span id="step"></span><span id="note"></span><button id="pause"></button>
</div>
